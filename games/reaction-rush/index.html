<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Reaction Rush — 5 Tap Reflex Test</title><meta name="description" content="Test your reflexes in five quick rounds. Free browser reaction game from GameFactoryLab."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(34px,9vw,56px)}.arena{height:330px;border-radius:22px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.06);user-select:none;touch-action:manipulation}.target{width:150px;height:150px;border-radius:50%;border:0;font-size:24px;font-weight:900;background:#bbf7d0;color:#111827;display:none}.wait{font-size:24px;font-weight:800}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center}.stat b{display:block;font-size:22px}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Reaction Rush</h1><p class="muted">Five rounds. Tap only when the target appears. Lower average wins.</p></section><section class="stats"><div class="card stat"><span class="muted">Round</span><b id="round">0/5</b></div><div class="card stat"><span class="muted">Last</span><b id="last">—</b></div><div class="card stat"><span class="muted">Avg</span><b id="avg">—</b></div></section><section id="arena" class="arena"><div id="wait" class="wait muted">Tap Start</div><button id="target" class="target">TAP!</button></section><div id="status" class="status muted">Ready when you are.</div><div class="actions"><button id="start" class="btn primary">Start</button><button id="share" class="btn secondary" disabled>Share</button></div></main><script src="../../core.js"></script><script>(()=>{const G='reaction-rush',arena=document.getElementById('arena'),target=document.getElementById('target'),wait=document.getElementById('wait'),roundEl=document.getElementById('round'),last=document.getElementById('last'),avg=document.getElementById('avg'),status=document.getElementById('status'),start=document.getElementById('start'),share=document.getElementById('share');let round=0,times=[],shownAt=0,pending=null,armed=false;GameFactory.open(G);function average(){return times.length?Math.round(times.reduce((a,b)=>a+b,0)/times.length):0}function schedule(){target.style.display='none';wait.style.display='block';wait.textContent='Wait for it…';armed=false;clearTimeout(pending);pending=setTimeout(()=>{wait.style.display='none';target.style.display='block';shownAt=performance.now();armed=true},800+Math.random()*2200)}function begin(){round=0;times=[];roundEl.textContent='0/5';last.textContent='—';avg.textContent='—';share.disabled=true;status.textContent='Focus…';GameFactory.event(G,'start');schedule()}function hit(){if(!armed)return;armed=false;const ms=Math.round(performance.now()-shownAt);times.push(ms);round++;roundEl.textContent=round+'/5';last.textContent=ms+' ms';avg.textContent=average()+' ms';GameFactory.event(G,'correct');if(round>=5){finish()}else setTimeout(schedule,450)}function finish(){clearTimeout(pending);target.style.display='none';wait.style.display='block';wait.textContent='Done';const score=Math.max(1,1000-average());GameFactory.score(G,score);status.textContent='Average: '+average()+' ms';share.disabled=false;GameFactory.event(G,'finish')}arena.addEventListener('pointerdown',e=>{if(e.target===target){hit();return}if(round>0&&round<5&&!armed){status.textContent='Too early — wait for the target';GameFactory.event(G,'early')}});target.onclick=e=>{e.stopPropagation();hit()};start.onclick=begin;share.onclick=async()=>{const r=await GameFactory.share(G,'Reaction Rush',`My 5-round reaction average was ${average()} ms. Can you beat it?`);if(r==='copied')status.textContent='Score link copied!'};})();</script></body></html>
