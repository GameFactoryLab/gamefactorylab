<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Ring Pins — One-Tap Timing Challenge</title>
<meta name="description" content="Tap to launch pins into a spinning ring. Avoid every pin already attached and chase a higher score in this fast free browser game.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/ring-pins/">
<meta property="og:title" content="Ring Pins — One-Tap Timing Challenge">
<meta property="og:description" content="Tap to launch. Don’t hit a pin. How many can you place?">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/ring-pins/">
<meta name="twitter:card" content="summary">
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#111827;color:#f8fafc;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}button,a{font:inherit}.app{width:min(100%,520px);margin:0 auto;display:grid;gap:8px;padding:8px 0 14px}.muted{color:#94a3b8}.back{color:#94a3b8;text-decoration:none;font-size:13px}.hero h1{font-size:clamp(30px,8vw,48px);line-height:1;margin:0}.hero p{margin:6px 0 0;font-size:14px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:8px}.stat{text-align:center}.stat span{font-size:9px;letter-spacing:.06em;text-transform:uppercase;color:#94a3b8}.stat b{display:block;font-size:20px;margin-top:2px}.stage{padding:6px}.stage canvas{display:block;width:min(78vw,320px);height:auto;aspect-ratio:8/9;margin:0 auto;border-radius:14px;background:#0b1220;touch-action:none}.status{text-align:center;min-height:24px;font-weight:800;font-size:14px}.rule{margin:0;text-align:center;font-size:11px;color:#94a3b8}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn{border:0;border-radius:13px;min-height:42px;padding:9px 10px;font-weight:900;cursor:pointer;touch-action:manipulation}.primary{background:#f8fafc;color:#111827}.secondary{background:rgba(255,255,255,.09);color:#f8fafc;border:1px solid rgba(255,255,255,.10)}.fire{grid-column:1/-1;font-size:17px;min-height:46px}.sharebox{display:none}.sharebox.show{display:block}.sharebox textarea{width:100%;min-height:78px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}.target{font-size:12px;text-align:center;margin:0;color:#bbf7d0}.target.bad{color:#fecaca}@media(max-height:700px){.app{gap:5px}.hero p{font-size:12px}.stage canvas{width:min(67vw,270px)}.card{padding:6px}.btn{min-height:39px;padding:7px 8px}.fire{min-height:42px}.rule{font-size:10px}}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="back">← GameFactoryLab</a>
<section class="hero"><h1>Ring Pins</h1><p class="muted">Tap to launch a pin into the spinning ring. Hit another pin and the run is over.</p></section>
<section class="stats"><div class="card stat"><span>Score</span><b id="score">0</b></div><div class="card stat"><span>Best</span><b id="best">0</b></div><div class="card stat"><span>Speed</span><b id="speed">1.0×</b></div></section>
<section class="card stage"><canvas id="game" width="320" height="360" aria-label="Ring Pins game area"></canvas></section>
<div id="status" class="status muted">Tap Start</div>
<p id="target" class="target" hidden></p>
<p class="rule">The ring speeds up as your score climbs and reverses direction every 8 pins.</p>
<div class="actions"><button id="fire" type="button" class="btn primary fire" disabled>Launch pin</button><button id="start" type="button" class="btn secondary">Start</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showText" type="button" class="btn secondary" disabled>Show share text</button></div>
<section id="shareBox" class="card sharebox"><textarea id="shareText" readonly aria-label="Share text"></textarea></section>
</main>
<script>
(()=>{
const G='ring-pins',W=320,H=360,CX=160,CY=142,R=56,PIN=62,LAND_Y=CY+R+9,START_Y=332;
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const el={score:document.getElementById('score'),best:document.getElementById('best'),speed:document.getElementById('speed'),status:document.getElementById('status'),target:document.getElementById('target'),fire:document.getElementById('fire'),start:document.getElementById('start'),share:document.getElementById('share'),showText:document.getElementById('showText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText')};
let pins=[],score=0,best=Number(localStorage.getItem('gf_ring-pins_best')||0),running=false,launching=null,omega=1.15,last=0,raf=0,direction=1;
el.best.textContent=best;
const q=new URLSearchParams(location.search),target=Number(q.get('target'));
if(Number.isFinite(target)&&target>=0){el.target.hidden=false;el.target.textContent=`Challenge: beat ${Math.floor(target)}`}
function norm(a){a%=Math.PI*2;if(a<0)a+=Math.PI*2;return a}
function angleDistance(a,b){const d=Math.abs(norm(a)-norm(b));return Math.min(d,Math.PI*2-d)}
function speedFactor(){return Math.abs(omega)/1.15}
function seedPins(){pins=[-1.55,-.15,1.15].map(a=>({a:norm(a)}))}
function reset(){score=0;direction=1;omega=1.15;launching=null;seedPins();el.score.textContent='0';el.speed.textContent='1.0×';el.share.disabled=true;el.showText.disabled=true;el.shareBox.classList.remove('show');el.target.classList.remove('bad')}
function drawPin(a,active=false){const x1=CX+Math.cos(a)*(R+4),y1=CY+Math.sin(a)*(R+4),x2=CX+Math.cos(a)*(R+PIN),y2=CY+Math.sin(a)*(R+PIN);ctx.strokeStyle=active?'#f8fafc':'#cbd5e1';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();ctx.fillStyle=active?'#f8fafc':'#cbd5e1';ctx.beginPath();ctx.arc(x2,y2,6,0,Math.PI*2);ctx.fill()}
function draw(){ctx.clearRect(0,0,W,H);const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#111827');g.addColorStop(1,'#07101d');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.strokeStyle='rgba(255,255,255,.08)';ctx.lineWidth=1;ctx.beginPath();ctx.arc(CX,CY,R+PIN,0,Math.PI*2);ctx.stroke();pins.forEach(p=>drawPin(p.a));ctx.fillStyle='#f8fafc';ctx.beginPath();ctx.arc(CX,CY,R,0,Math.PI*2);ctx.fill();ctx.fillStyle='#111827';ctx.font='900 25px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(String(score),CX,CY);
ctx.strokeStyle='rgba(255,255,255,.35)';ctx.setLineDash([5,7]);ctx.beginPath();ctx.moveTo(CX,LAND_Y+6);ctx.lineTo(CX,START_Y-14);ctx.stroke();ctx.setLineDash([]);if(launching){ctx.fillStyle='#bbf7d0';ctx.beginPath();ctx.arc(CX,launching.y,7,0,Math.PI*2);ctx.fill()}else{ctx.fillStyle=running?'#bbf7d0':'#64748b';ctx.beginPath();ctx.arc(CX,START_Y,7,0,Math.PI*2);ctx.fill()}ctx.fillStyle='rgba(248,250,252,.65)';ctx.font='12px system-ui,sans-serif';ctx.fillText(running?'Tap to launch':'Start a run',CX,H-11)}
function collisionAtBottom(){const a=Math.PI/2;const threshold=.255;return pins.some(p=>angleDistance(p.a,a)<threshold)}
function finish(){if(!running)return;running=false;launching=null;cancelAnimationFrame(raf);best=Math.max(best,score);localStorage.setItem('gf_ring-pins_best',String(best));el.best.textContent=best;el.fire.disabled=true;el.share.disabled=false;el.showText.disabled=false;el.status.textContent=`Collision! Score ${score}. Best ${best}.`;if(Number.isFinite(target)&&target>=0){el.target.hidden=false;if(score>target){el.target.textContent=`Challenge beaten ✓ ${score} > ${Math.floor(target)}`;el.target.classList.remove('bad')}else{el.target.textContent=`Target ${Math.floor(target)} · you scored ${score}`;el.target.classList.add('bad')}}draw()}
function land(){launching=null;if(collisionAtBottom()){finish();return}pins.push({a:Math.PI/2});score++;el.score.textContent=score;if(score%8===0)direction*=-1;omega=direction*(1.15+Math.min(1.75,score*.055));el.speed.textContent=speedFactor().toFixed(1)+'×';el.status.textContent=score%8===0?'Reverse!':score%5===0?'Nice gap!':'Keep going'}
function launch(){if(!running||launching)return;launching={y:START_Y};el.status.textContent='';draw()}
function loop(ts){if(!running)return;const dt=Math.min(.04,(ts-last||0)/1000);last=ts;for(const p of pins)p.a=norm(p.a+omega*dt);if(launching){launching.y-=690*dt;if(launching.y<=LAND_Y)land()}draw();raf=requestAnimationFrame(loop)}
function begin(){cancelAnimationFrame(raf);reset();running=true;last=0;el.start.textContent='Restart';el.fire.disabled=false;el.status.textContent='Wait for a gap, then tap';draw();raf=requestAnimationFrame(loop)}
function shareText(){return `I placed ${score} pins in Ring Pins. Can you beat me?`}
function challengeUrl(){const u=new URL(location.href);u.search='';u.searchParams.set('target',String(score));u.searchParams.set('challenge','1');return u.href}
async function share(){const text=shareText(),url=challengeUrl();if(navigator.share){try{await navigator.share({title:'Ring Pins',text,url});el.status.textContent='Shared!';return}catch(e){if(e&&e.name==='AbortError')return}}try{await navigator.clipboard.writeText(text+' '+url);el.status.textContent='Challenge link copied!'}catch{showText()}}
function showText(){el.shareText.value=shareText()+' '+challengeUrl();el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
el.start.addEventListener('click',begin);el.fire.addEventListener('pointerup',e=>{e.preventDefault();launch()});el.fire.addEventListener('click',e=>{e.preventDefault();launch()});canvas.addEventListener('pointerdown',e=>{if(running){e.preventDefault();launch()}});window.addEventListener('keydown',e=>{if((e.code==='Space'||e.code==='Enter')&&running){e.preventDefault();launch()}});el.share.addEventListener('click',share);el.showText.addEventListener('click',showText);reset();draw();
})();
</script>
</body>
</html>
