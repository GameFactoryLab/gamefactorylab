<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Lane Dodge — Fast One-Tap Browser Game</title>
<meta name="description" content="Dodge falling blocks across three lanes, survive the accelerating pace, and chase a higher score in this free instant browser game.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/lane-dodge/">
<meta property="og:title" content="Lane Dodge — Fast One-Tap Browser Game">
<meta property="og:description" content="Move across three lanes, dodge the falling blocks, and challenge a friend to beat your score.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/lane-dodge/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(34px,9vw,54px);line-height:1}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{text-align:center;padding:10px}.stat span{font-size:10px;text-transform:uppercase}.stat b{display:block;font-size:22px}.stage-wrap{padding:8px}.stage{position:relative;width:min(100%,420px);aspect-ratio:3/4;margin:auto;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,#111827,#0b1220);border:1px solid rgba(255,255,255,.09);touch-action:none;user-select:none}.lane{position:absolute;top:0;bottom:0;width:33.333%;border-right:1px dashed rgba(255,255,255,.09)}.lane:nth-child(1){left:0}.lane:nth-child(2){left:33.333%}.lane:nth-child(3){left:66.666%;border-right:0}.player,.obstacle{position:absolute;width:22%;aspect-ratio:1;border-radius:12px;transform:translateX(-50%)}.player{bottom:4%;background:#34d399;box-shadow:0 0 22px rgba(52,211,153,.28);transition:left .08s ease-out}.obstacle{top:-25%;background:#fb7185;box-shadow:0 0 18px rgba(251,113,133,.18)}.status{text-align:center;min-height:28px;font-weight:800}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;max-width:420px;margin:auto}.controls button{min-height:54px;font-size:22px}.actions,.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result-actions .primary{grid-column:1/-1}.sharebox,.result{display:none}.sharebox.show,.result.show{display:block}.result{text-align:center;border:1px solid rgba(52,211,153,.28);background:rgba(16,185,129,.08)}.result .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#86efac}.result strong{display:block;font-size:28px;margin:4px 0 10px}.sharebox textarea{width:100%;min-height:88px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}.rule{font-size:13px}.flash{animation:hit .22s ease}@keyframes hit{0%{filter:brightness(1)}50%{filter:brightness(1.8)}100%{filter:brightness(1)}}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Lane Dodge</h1><p class="muted">Three lanes. One safe move at a time. Dodge the falling blocks as the pace keeps getting faster.</p></section>
<section class="stats"><div class="card stat"><span class="muted">Score</span><b id="score">0</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div><div class="card stat"><span class="muted">Speed</span><b id="speed">1.0×</b></div></section>
<section class="card stage-wrap"><div id="stage" class="stage" role="application" aria-label="Lane Dodge game area"><div class="lane"></div><div class="lane"></div><div class="lane"></div><div id="player" class="player" aria-label="player"></div></div></section>
<div id="status" class="status muted">Tap Start</div>
<p class="muted rule">Move with ← →, A/D, the buttons, or tap a lane. Every block you dodge scores one point.</p>
<section id="result" class="card result" aria-live="polite"><div class="eyebrow">Run complete</div><strong id="resultSummary">Score 0</strong><div class="result-actions"><button id="playAgain" type="button" class="btn primary">Play again</button><button id="resultShare" type="button" class="btn secondary">Share result</button><button id="resultText" type="button" class="btn secondary">Show share text</button></div></section>
<div class="controls"><button class="btn secondary" data-lane="0" type="button">← Left</button><button class="btn secondary" data-lane="1" type="button">Center</button><button class="btn secondary" data-lane="2" type="button">Right →</button></div>
<div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showText" type="button" class="btn secondary" disabled>Show share text</button></div>
<section id="shareBox" class="card sharebox"><label for="shareText" class="muted">Long-press to copy and share:</label><textarea id="shareText" readonly></textarea></section>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='lane-dodge';
const stage=document.getElementById('stage'),player=document.getElementById('player');
const el={score:document.getElementById('score'),best:document.getElementById('best'),speed:document.getElementById('speed'),status:document.getElementById('status'),start:document.getElementById('start'),share:document.getElementById('share'),showText:document.getElementById('showText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText'),result:document.getElementById('result'),resultSummary:document.getElementById('resultSummary'),playAgain:document.getElementById('playAgain'),resultShare:document.getElementById('resultShare'),resultText:document.getElementById('resultText')};
let lane=1,score=0,running=false,last=0,elapsed=0,spawnClock=0,obstacles=[],raf=0;
GameFactory.open(G);el.best.textContent=GameFactory.stats(G).best||0;
const laneLeft=i=>((i+.5)/3*100)+'%';
function setLane(next){if(!running&&next!==1)return;const safe=Math.max(0,Math.min(2,next));if(safe!==lane&&running)GameFactory.event(G,'lane_move');lane=safe;player.style.left=laneLeft(lane)}
function clearObstacles(){for(const o of obstacles)o.el.remove();obstacles=[]}
function difficulty(){return Math.min(2.8,1+elapsed/26000)}
function spawnInterval(){return Math.max(430,920-elapsed/55)}
function spawn(){const i=Math.floor(Math.random()*3),d=document.createElement('div');d.className='obstacle';d.style.left=laneLeft(i);stage.appendChild(d);obstacles.push({lane:i,y:-25,el:d,counted:false});GameFactory.event(G,'spawn')}
function finish(){if(!running)return;running=false;cancelAnimationFrame(raf);const s=GameFactory.score(G,score),best=s.best||score;el.best.textContent=best;el.status.textContent=`Crash. Score ${score}. Best ${best}.`;el.resultSummary.textContent=`Score ${score} · Best ${best}`;el.result.classList.add('show');el.start.textContent='Play again';el.share.disabled=false;el.showText.disabled=false;stage.classList.add('flash');setTimeout(()=>stage.classList.remove('flash'),240);GameFactory.event(G,'crash');GameFactory.event(G,'finish');GameFactory.event(G,'result_view');setTimeout(()=>el.result.scrollIntoView({behavior:'smooth',block:'center'}),80)}
function frame(t){if(!running)return;if(!last)last=t;const dt=Math.min(34,t-last);last=t;elapsed+=dt;spawnClock+=dt;const mult=difficulty();el.speed.textContent=mult.toFixed(1)+'×';if(spawnClock>=spawnInterval()){spawnClock=0;spawn()}
  const stageH=stage.clientHeight||480,playerTop=player.offsetTop,playerBottom=playerTop+player.offsetHeight;
  for(const o of obstacles){o.y+=dt*.05*mult;o.el.style.top=o.y+'%';const top=stageH*o.y/100,bottom=top+o.el.offsetHeight;if(o.lane===lane&&bottom>=playerTop&&top<=playerBottom){finish();return}if(!o.counted&&top>stageH){o.counted=true;score++;el.score.textContent=score;GameFactory.event(G,'dodge')}}
  obstacles=obstacles.filter(o=>{if(o.counted){o.el.remove();return false}return true});raf=requestAnimationFrame(frame)}
function begin(){cancelAnimationFrame(raf);clearObstacles();lane=1;score=0;elapsed=0;spawnClock=300;last=0;running=true;setLane(1);el.score.textContent='0';el.speed.textContent='1.0×';el.start.textContent='Restart';el.share.disabled=true;el.showText.disabled=true;el.shareBox.classList.remove('show');el.result.classList.remove('show');el.status.textContent='Dodge the blocks';GameFactory.event(G,'start');raf=requestAnimationFrame(frame)}
function text(){return `I dodged ${score} blocks in Lane Dodge. Can you beat it?`}
function show(){el.shareText.value=text()+' '+GameFactory.challengeUrl(G,score);el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
async function doShare(fromResult=false){if(fromResult)GameFactory.event(G,'result_share_click');const r=await GameFactory.share(G,'Lane Dodge',text());if(r==='copied')el.status.textContent='Challenge link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='manual')show()}
function replay(){GameFactory.event(G,'replay_click');begin()}
document.querySelectorAll('[data-lane]').forEach(b=>b.onclick=()=>setLane(Number(b.dataset.lane)));
stage.addEventListener('pointerdown',e=>{if(!running)return;const r=stage.getBoundingClientRect(),x=(e.clientX-r.left)/r.width;setLane(Math.min(2,Math.floor(x*3)))});
window.addEventListener('keydown',e=>{if(!running)return;if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A'){e.preventDefault();setLane(lane-1)}else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D'){e.preventDefault();setLane(lane+1)}else if(e.key==='1')setLane(0);else if(e.key==='2')setLane(1);else if(e.key==='3')setLane(2)});
el.start.onclick=()=>{if(!running&&el.start.textContent==='Play again')GameFactory.event(G,'replay_click');begin()};el.playAgain.onclick=replay;el.share.onclick=()=>doShare(false);el.resultShare.onclick=()=>doShare(true);el.showText.onclick=show;el.resultText.onclick=show;setLane(1);
})();
</script>
</body>
</html>
