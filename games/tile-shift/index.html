<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Tile Shift — Fast Sliding Puzzle Challenge</title>
<meta name="description" content="Slide numbered tiles into order and clear as many 3x3 puzzles as you can in 60 seconds. A fast free browser sliding puzzle challenge.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/tile-shift/">
<meta property="og:title" content="Tile Shift — Fast Sliding Puzzle Challenge">
<meta property="og:description" content="Slide the tiles into order before the clock runs out. How many boards can you clear in 60 seconds?">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/tile-shift/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(30px,8vw,46px);line-height:1}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.stat{text-align:center;padding:7px 4px}.stat span{font-size:9px;text-transform:uppercase}.stat b{display:block;font-size:19px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;max-width:340px;width:min(82vw,340px);margin:0 auto}.tile{aspect-ratio:1;border-radius:13px;border:1px solid rgba(255,255,255,.12);background:#f8fafc;color:#111827;font-size:clamp(30px,12vw,54px);font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:transform .1s ease,opacity .1s ease}.tile:active{transform:scale(.96)}.tile.blank{background:rgba(255,255,255,.035);border-style:dashed;color:transparent;box-shadow:inset 0 0 0 1px rgba(255,255,255,.02)}.tile:disabled{opacity:.82}.status{text-align:center;min-height:24px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.actions .btn{min-height:42px;padding:8px 10px}.danger{background:rgba(254,202,202,.12);color:#fecaca;border:1px solid rgba(254,202,202,.25)}.sharebox{display:none}.sharebox.show{display:block}.sharebox textarea{width:100%;min-height:88px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}.rule{font-size:11px;margin:2px 0}.app{gap:7px}.card{padding:8px}@media(max-height:700px){.board{max-width:300px;width:min(74vw,300px)}.app{gap:5px}.card{padding:6px}.actions .btn{min-height:40px;padding:7px 8px;font-size:13px}}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Tile Shift</h1><p class="muted">Slide a numbered tile into the empty space. Put 1–8 back in order before the 60-second clock runs out.</p></section>
<section class="stats"><div class="card stat"><span class="muted">Clears</span><b id="score">0</b></div><div class="card stat"><span class="muted">Time</span><b id="time">60</b></div><div class="card stat"><span class="muted">Moves</span><b id="moves">0</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section>
<section class="card"><div id="board" class="board" aria-label="Sliding tile puzzle"></div></section>
<div id="status" class="status muted">Tap Start</div>
<p class="muted rule">Every board is made by legal moves from the solved position, so it is always solvable. Reshuffle costs 3 seconds.</p>
<div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="shuffle" type="button" class="btn secondary" disabled>Reshuffle</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showText" type="button" class="btn secondary" disabled>Show share text</button></div>
<section id="shareBox" class="card sharebox"><label for="shareText" class="muted">Long-press to copy and share:</label><textarea id="shareText" readonly></textarea></section>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='tile-shift';
const solved=[1,2,3,4,5,6,7,8,0];
const el={board:document.getElementById('board'),score:document.getElementById('score'),time:document.getElementById('time'),moves:document.getElementById('moves'),best:document.getElementById('best'),status:document.getElementById('status'),start:document.getElementById('start'),shuffle:document.getElementById('shuffle'),end:document.getElementById('end'),share:document.getElementById('share'),showText:document.getElementById('showText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText')};
let board=[...solved],score=0,time=60,moves=0,stage=1,running=false,locked=true,timer=null;
GameFactory.open(G);el.best.textContent=GameFactory.stats(G).best||0;
function neighbors(i){const r=Math.floor(i/3),c=i%3,out=[];if(r>0)out.push(i-3);if(r<2)out.push(i+3);if(c>0)out.push(i-1);if(c<2)out.push(i+1);return out}
function isSolved(){return board.every((v,i)=>v===solved[i])}
function render(){el.board.innerHTML='';board.forEach((v,i)=>{const b=document.createElement('button');b.type='button';b.className='tile'+(v===0?' blank':'');b.textContent=v===0?'':String(v);b.setAttribute('aria-label',v===0?'Empty space':`Tile ${v}`);b.disabled=!running||locked||v===0;b.onclick=()=>tap(i);el.board.appendChild(b)})}
function scramble(){
  board=[...solved];let blank=8,last=-1;const steps=Math.min(46,10+(stage-1)*4);
  for(let n=0;n<steps;n++){
    let opts=neighbors(blank).filter(i=>i!==last);if(!opts.length)opts=neighbors(blank);
    const pick=opts[Math.floor(Math.random()*opts.length)];last=blank;[board[blank],board[pick]]=[board[pick],board[blank]];blank=pick;
  }
  if(isSolved()){const pick=neighbors(8)[0];[board[8],board[pick]]=[board[pick],board[8]]}
  moves=0;el.moves.textContent='0';locked=false;render();el.status.textContent=`Puzzle ${stage} · ${steps} shuffle moves`;
}
function tap(i){if(!running||locked)return;const blank=board.indexOf(0);if(!neighbors(blank).includes(i))return;[board[blank],board[i]]=[board[i],board[blank]];moves++;el.moves.textContent=moves;GameFactory.event(G,'move');render();if(isSolved()){locked=true;score++;el.score.textContent=score;GameFactory.event(G,'puzzle_clear');el.status.textContent=`Solved in ${moves} moves!`;stage++;setTimeout(()=>{if(running)scramble()},420)}}
function reshuffle(){if(!running||locked)return;time=Math.max(0,time-3);el.time.textContent=time;GameFactory.event(G,'reshuffle');el.status.textContent='Reshuffled · -3 sec';if(time===0){finish('Time!');return}scramble()}
function begin(){clearInterval(timer);score=0;time=60;moves=0;stage=1;running=true;locked=false;el.score.textContent='0';el.time.textContent='60';el.moves.textContent='0';el.start.textContent='Restart';el.shuffle.disabled=false;el.end.disabled=false;el.share.disabled=true;el.showText.disabled=true;el.shareBox.classList.remove('show');GameFactory.event(G,'start');scramble();timer=setInterval(()=>{if(!running)return;time--;el.time.textContent=time;if(time<=0)finish('Time!')},1000)}
function finish(prefix){if(!running)return;running=false;locked=true;clearInterval(timer);render();const s=GameFactory.score(G,score);el.best.textContent=s.best||score;el.status.textContent=`${prefix} Clears: ${score}. Best: ${s.best||score}.`;el.shuffle.disabled=true;el.end.disabled=true;el.share.disabled=false;el.showText.disabled=false;GameFactory.event(G,'finish')}
function text(){return `I cleared ${score} Tile Shift puzzle${score===1?'':'s'} in 60 seconds. Can you beat me?`}
function show(){el.shareText.value=text()+' '+GameFactory.challengeUrl(G,score);el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
el.start.onclick=begin;el.shuffle.onclick=reshuffle;el.end.onclick=()=>{GameFactory.event(G,'manual_end');finish('Game ended.')};el.share.onclick=async()=>{const r=await GameFactory.share(G,'Tile Shift',text());if(r==='copied')el.status.textContent='Challenge link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='manual')show()};el.showText.onclick=show;render();
})();
</script>
</body>
</html>
