<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Color Word Challenge — 30 Second Brain Sprint</title><meta name="description" content="Tap the ink color, not the word. A fast 30 second free browser brain challenge."><link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/color-word-challenge/"><meta property="og:title" content="Color Word Challenge — 30 Second Brain Sprint"><meta property="og:description" content="Tap the ink color, not the word. How many can you get in 30 seconds?"><meta property="og:type" content="website"><meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/color-word-challenge/"><meta name="twitter:card" content="summary"><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}p{margin:4px 0 0;font-size:13px}.prompt{text-align:center;padding:22px 8px}.word{font-size:clamp(54px,17vw,92px);font-weight:950;letter-spacing:.02em;line-height:1}.rule{font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.answers button{font-size:20px;min-height:58px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stats .card{text-align:center}.stats strong{display:block;font-size:22px}.stats span{font-size:11px;text-transform:uppercase}.status{text-align:center;min-height:26px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sharebox{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;font-size:13px;line-height:1.35;word-break:break-word}.sharebox.show{display:block}.sharebox strong{display:block;margin-bottom:5px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Color Word Challenge</h1><p class="muted">30 seconds. Tap the INK color, not the word. Wrong answer costs 2 seconds.</p></section><section class="stats"><div class="card"><span class="muted">Score</span><strong id="score">0</strong></div><div class="card"><span class="muted">Time</span><strong id="time">30</strong></div><div class="card"><span class="muted">Best</span><strong id="best">0</strong></div></section><section class="card prompt"><div class="rule muted">Tap the ink color</div><div id="word" class="word">BLUE</div></section><div class="answers" id="answers"></div><div id="status" class="status muted">Tap Start</div><div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showShare" type="button" class="btn secondary" disabled>Show share text</button></div><div id="shareBox" class="sharebox" aria-live="polite"></div></main><script src="../../core.js"></script><script>(()=>{const G='color-word-challenge',colors=[{name:'Red',css:'#ef4444'},{name:'Blue',css:'#60a5fa'},{name:'Green',css:'#4ade80'},{name:'Yellow',css:'#facc15'}],word=document.getElementById('word'),answers=document.getElementById('answers'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start'),end=document.getElementById('end'),share=document.getElementById('share'),showShare=document.getElementById('showShare'),shareBox=document.getElementById('shareBox');let target='Blue',score=0,time=30,timer=null,running=false;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function round(){const ink=colors[Math.floor(Math.random()*colors.length)];let label=colors[Math.floor(Math.random()*colors.length)];if(score>2&&Math.random()<.78){while(label.name===ink.name)label=colors[Math.floor(Math.random()*colors.length)]}target=ink.name;word.textContent=label.name.toUpperCase();word.style.color=ink.css;answers.innerHTML='';shuffle(colors.slice()).forEach(c=>{const btn=document.createElement('button');btn.type='button';btn.className='btn secondary';btn.textContent=c.name;btn.addEventListener('click',()=>choose(c.name));answers.appendChild(btn)})}function choose(name){if(!running)return;if(name===target){score++;scoreEl.textContent=score;status.textContent=score%10===0?'Nice streak!':'Correct';GameFactory.event(G,'correct');round()}else{time=Math.max(0,time-2);timeEl.textContent=time;status.textContent='Wrong · -2 sec';GameFactory.event(G,'wrong');if(time===0)finish('Time!')}}function begin(){clearInterval(timer);score=0;time=30;running=true;scoreEl.textContent='0';timeEl.textContent='30';share.disabled=true;showShare.disabled=true;end.disabled=false;shareBox.classList.remove('show');shareBox.textContent='';status.textContent='Go!';start.textContent='Restart';GameFactory.event(G,'start');round();timer=setInterval(()=>{if(!running)return;time--;timeEl.textContent=time;if(time<=0)finish('Time!')},1000)}function finish(prefix){if(!running)return;running=false;clearInterval(timer);const s=GameFactory.score(G,score);bestEl.textContent=s.best||score;status.textContent=prefix+' Score '+score+'.';end.disabled=true;share.disabled=false;showShare.disabled=false;GameFactory.event(G,'finish')}function shareText(){return `I got ${score} in the Color Word Challenge. Can you beat me?`}function manual(){const u=GameFactory.challengeUrl(G,score);shareBox.innerHTML='<strong>Share this challenge:</strong>'+shareText()+' '+u;shareBox.classList.add('show');status.textContent='Use the text below to share your challenge.'}start.addEventListener('click',begin);end.addEventListener('click',()=>finish('Game ended.'));share.addEventListener('click',async()=>{const r=await GameFactory.share(G,'Color Word Challenge',shareText());if(r==='copied')status.textContent='Challenge link copied!';else if(r==='manual')manual()});showShare.addEventListener('click',manual);round()})();</script></body></html>
