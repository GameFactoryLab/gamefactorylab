<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Higher or Lower — Streak Challenge</title><meta name="description" content="Guess whether the next number is higher or lower and build the longest streak you can. Free browser game."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(34px,9vw,56px)}.number{font-size:clamp(90px,28vw,150px);font-weight:900;text-align:center;padding:24px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choices button{font-size:22px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:24px}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Higher or Lower</h1><p class="muted">Will the next number be higher or lower? One wrong guess ends the streak.</p></section><section class="stats"><div class="card stat"><span class="muted">Streak</span><b id="streak">0</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section><section class="card"><div id="number" class="number">5</div></section><div class="choices"><button id="higher" class="btn primary">Higher ↑</button><button id="lower" class="btn secondary">Lower ↓</button></div><div id="status" class="status muted">Tap Start to begin.</div><div class="actions"><button id="start" class="btn secondary">Start / Restart</button><button id="share" class="btn secondary" disabled>Share</button></div></main><script src="../../core.js"></script><script>(()=>{const G='higher-lower',number=document.getElementById('number'),streakEl=document.getElementById('streak'),bestEl=document.getElementById('best'),status=document.getElementById('status'),higher=document.getElementById('higher'),lower=document.getElementById('lower'),start=document.getElementById('start'),share=document.getElementById('share');let current=5,streak=0,running=false;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;function drawNext(){let n=current;while(n===current)n=1+Math.floor(Math.random()*9);return n}function begin(){current=1+Math.floor(Math.random()*9);streak=0;running=true;number.textContent=current;streakEl.textContent='0';share.disabled=true;status.textContent='Make your call';GameFactory.event(G,'start')}function guess(dir){if(!running)return;const next=drawNext();const ok=dir==='higher'?next>current:next<current;number.textContent=next;if(ok){streak++;streakEl.textContent=streak;status.textContent='Correct — keep going';GameFactory.event(G,'correct');current=next}else{running=false;const s=GameFactory.score(G,streak);bestEl.textContent=s.best||streak;status.textContent='Wrong. Final streak: '+streak;share.disabled=false;GameFactory.event(G,'finish')}}higher.onclick=()=>guess('higher');lower.onclick=()=>guess('lower');start.onclick=begin;share.onclick=async()=>{const r=await GameFactory.share(G,'Higher or Lower',`I hit a ${streak}-guess streak in Higher or Lower. Can you beat it?`);if(r==='copied')status.textContent='Score link copied!'};})();</script></body></html>
