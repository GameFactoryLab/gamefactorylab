<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Higher or Lower — Streak Challenge</title><meta name="description" content="Guess whether the next number is higher or lower and build the longest streak you can. Free browser game."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}p{margin:4px 0 0;font-size:13px}.number{font-size:clamp(84px,27vw,140px);font-weight:900;text-align:center;padding:16px 0}.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px}.choices button{font-size:21px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:11px;text-transform:uppercase}.status{text-align:center;min-height:26px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sharebox{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;font-size:13px;line-height:1.35;word-break:break-word}.sharebox.show{display:block}.sharebox strong{display:block;margin-bottom:5px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Higher or Lower</h1><p class="muted">Will the next number be higher or lower? One wrong guess ends the streak.</p></section><section class="stats"><div class="card stat"><span class="muted">Streak</span><b id="streak">0</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section><section class="card"><div id="number" class="number">5</div></section><div class="choices"><button id="higher" type="button" class="btn primary" disabled>Higher ↑</button><button id="lower" type="button" class="btn secondary" disabled>Lower ↓</button></div><div id="status" class="status muted">Tap Start to begin.</div><div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End streak</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showShare" type="button" class="btn secondary" disabled>Show share text</button></div><div id="shareBox" class="sharebox" aria-live="polite"></div></main><script src="../../core.js"></script><script>(()=>{const G='higher-lower',URL='https://gamefactorylab.github.io/gamefactorylab/games/higher-lower/',number=document.getElementById('number'),streakEl=document.getElementById('streak'),bestEl=document.getElementById('best'),status=document.getElementById('status'),higher=document.getElementById('higher'),lower=document.getElementById('lower'),start=document.getElementById('start'),end=document.getElementById('end'),share=document.getElementById('share'),showShare=document.getElementById('showShare'),shareBox=document.getElementById('shareBox');let current=5,streak=0,running=false;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;function drawNext(){let n=current;while(n===current)n=1+Math.floor(Math.random()*9);return n}function begin(){current=1+Math.floor(Math.random()*9);streak=0;running=true;number.textContent=current;streakEl.textContent='0';share.disabled=true;showShare.disabled=true;end.disabled=false;higher.disabled=false;lower.disabled=false;shareBox.classList.remove('show');shareBox.textContent='';status.textContent='Make your call';start.textContent='Restart';GameFactory.event(G,'start')}function finish(prefix){if(!running)return;running=false;const s=GameFactory.score(G,streak);bestEl.textContent=s.best||streak;status.textContent=prefix+' Final streak: '+streak+'.';higher.disabled=true;lower.disabled=true;end.disabled=true;share.disabled=false;showShare.disabled=false;GameFactory.event(G,'finish')}function guess(dir){if(!running)return;const next=drawNext(),ok=dir==='higher'?next>current:next<current;number.textContent=next;if(ok){streak++;streakEl.textContent=streak;status.textContent='Correct — keep going';GameFactory.event(G,'correct');current=next}else finish('Wrong.')}function shareText(){return `I hit a ${streak}-guess streak in Higher or Lower. Can you beat it?`}function manual(){shareBox.innerHTML='<strong>Share this score:</strong>'+shareText()+' '+URL;shareBox.classList.add('show');status.textContent='Use the text below to share your score.'}higher.addEventListener('click',()=>guess('higher'));lower.addEventListener('click',()=>guess('lower'));start.addEventListener('click',begin);end.addEventListener('click',()=>finish('Streak ended.'));share.addEventListener('click',async()=>{const r=await GameFactory.share(G,'Higher or Lower',shareText(),URL);if(r==='copied')status.textContent='Score link copied!';else if(r==='unsupported')manual()});showShare.addEventListener('click',manual)})();</script></body></html>
