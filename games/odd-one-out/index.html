<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Odd One Out — 30 Second Visual Challenge</title>
<meta name="description" content="Find the odd symbol as fast as you can. A free 30-second visual challenge from GameFactoryLab.">
<meta property="og:title" content="Odd One Out — 30 Second Visual Challenge">
<meta property="og:description" content="How many can you spot in 30 seconds?">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(30px,9vw,52px);line-height:1}.top{display:flex;justify-content:space-between;gap:12px;align-items:center}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:10px}.stat b{display:block;font-size:22px}.grid{display:grid;gap:8px;touch-action:manipulation;width:100%;max-width:520px;margin:auto;aspect-ratio:1}.tile{aspect-ratio:1;border:0;border-radius:14px;font-size:clamp(26px,9vw,46px);font-weight:800;background:#f8fafc;color:#111827;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.2);-webkit-tap-highlight-color:transparent}.tile:active{transform:translateY(1px)}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:rgba(254,202,202,.12);color:#fecaca;border:1px solid rgba(254,202,202,.25)}.sharebox{display:none}.sharebox.show{display:block}.sharebox textarea{width:100%;min-height:88px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}.best{font-size:13px}.pulse{animation:p .16s ease}@keyframes p{50%{transform:scale(1.035)}}@media(max-height:720px){.app{gap:9px;padding-top:10px}.grid{max-width:360px}.card{padding:10px}.btn{padding:10px 12px}}
</style>
</head>
<body>
<main class="app">
<div class="top"><a href="../../index.html" class="muted">← GameFactoryLab</a><span class="muted best">Best <b id="best">0</b></span></div>
<section><h1>Odd One Out</h1><p class="muted">Spot the different symbol. 30 seconds. Wrong tap costs 2 seconds.</p></section>
<section class="stats"><div class="card stat"><span class="muted">Score</span><b id="score">0</b></div><div class="card stat"><span class="muted">Time</span><b id="time">30</b></div><div class="card stat"><span class="muted">Grid</span><b id="level">3×3</b></div></section>
<section class="card"><div id="grid" class="grid"></div></section>
<div id="status" class="status muted">Tap Start to begin</div>
<div class="actions">
<button id="start" class="btn primary" type="button">Start</button>
<button id="end" class="btn danger" type="button" disabled>End game</button>
<button id="share" class="btn secondary" type="button" disabled>Share score</button>
<button id="showText" class="btn secondary" type="button" disabled>Show share text</button>
</div>
<section id="shareBox" class="card sharebox" aria-live="polite"><label for="shareText" class="muted">Long-press to copy and share:</label><textarea id="shareText" readonly></textarea></section>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
  const GAME='odd-one-out',pairs=[['●','○'],['■','□'],['▲','△'],['◆','◇'],['★','☆'],['✚','✖'],['⬟','⬢']];
  const el={grid:document.getElementById('grid'),score:document.getElementById('score'),time:document.getElementById('time'),level:document.getElementById('level'),status:document.getElementById('status'),start:document.getElementById('start'),end:document.getElementById('end'),share:document.getElementById('share'),showText:document.getElementById('showText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText'),best:document.getElementById('best')};
  let score=0,time=30,target=0,running=false,timer=null,size=3;
  GameFactory.open(GAME);el.best.textContent=GameFactory.stats(GAME).best||0;
  function difficulty(){return score<6?3:score<14?4:5}
  function message(){return `I spotted ${score} odd symbols in Odd One Out. Can you beat my score? ${location.href}`}
  function showShareText(){el.shareText.value=message();el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
  function round(){size=difficulty();el.level.textContent=size+'×'+size;el.grid.style.gridTemplateColumns=`repeat(${size},1fr)`;el.grid.innerHTML='';const [a,b]=pairs[Math.floor(Math.random()*pairs.length)];const count=size*size;target=Math.floor(Math.random()*count);for(let i=0;i<count;i++){const btn=document.createElement('button');btn.type='button';btn.className='tile';btn.textContent=i===target?b:a;btn.setAttribute('aria-label',i===target?'different symbol':'symbol');btn.onclick=()=>hit(i,btn);el.grid.appendChild(btn)}}
  function hit(i,btn){if(!running)return;if(i===target){score++;el.score.textContent=score;GameFactory.event(GAME,'correct');el.grid.classList.remove('pulse');void el.grid.offsetWidth;el.grid.classList.add('pulse');round()}else{time=Math.max(0,time-2);el.time.textContent=time;GameFactory.event(GAME,'wrong');btn.style.opacity='.45';setTimeout(()=>btn.style.opacity='1',150);if(time===0)finish('Time!')}}
  function start(){clearInterval(timer);score=0;time=30;running=true;el.score.textContent='0';el.time.textContent='30';el.status.textContent='Go!';el.start.textContent='Restart';el.end.disabled=false;el.share.disabled=true;el.showText.disabled=true;el.shareBox.classList.remove('show');round();GameFactory.event(GAME,'start');timer=setInterval(()=>{if(!running)return;time--;el.time.textContent=time;if(time<=0)finish('Time!')},1000)}
  function finish(prefix){if(!running)return;running=false;clearInterval(timer);const s=GameFactory.score(GAME,score);el.best.textContent=s.best||score;el.status.textContent=`${prefix} Score: ${score}. Best: ${s.best||score}.`;el.end.disabled=true;el.share.disabled=false;el.showText.disabled=false;GameFactory.event(GAME,'finish')}
  el.start.onclick=start;
  el.end.onclick=()=>{GameFactory.event(GAME,'manual_end');finish('Game ended.')};
  el.share.onclick=async()=>{const r=await GameFactory.share(GAME,'Odd One Out',`I spotted ${score} odd symbols in Odd One Out. Can you beat my score?`);if(r==='copied')el.status.textContent='Score link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='unsupported'){showShareText();el.status.textContent='Use the share text below.'}};
  el.showText.onclick=showShareText;
  round();
})();
</script>
</body>
</html>
