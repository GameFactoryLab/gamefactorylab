<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Odd One Out</title><link rel="stylesheet" href="../../core.css"><style>.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{aspect-ratio:1;border:0;border-radius:16px;font-size:38px}.stats{display:flex;justify-content:space-between}.status{text-align:center;min-height:24px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><h1>Odd One Out</h1><div class="stats"><strong>Score <span id="score">0</span></strong><strong>Time <span id="time">60</span></strong></div><div class="card"><div id="grid" class="grid"></div></div><div id="status" class="status muted">Press Start</div><button id="start" class="btn primary">Start Game</button></main><script>let score=0,time=60,timer=null,target=0,running=false;const pairs=[['●','○'],['■','□'],['▲','△'],['◆','◇'],['★','☆']];function round(){const g=document.getElementById('grid');g.innerHTML='';const [a,b]=pairs[Math.floor(Math.random()*pairs.length)];target=Math.floor(Math.random()*9);for(let i=0;i<9;i++){const x=document.createElement('button');x.className='tile';x.textContent=i===target?b:a;x.onclick=()=>{if(!running)return;if(i===target){score++;document.getElementById('score').textContent=score;round()}else{time=Math.max(0,time-2);document.getElementById('time').textContent=time}};g.appendChild(x)}}function start(){clearInterval(timer);score=0;time=60;running=true;document.getElementById('score').textContent=0;document.getElementById('time').textContent=60;document.getElementById('status').textContent='Go!';round();timer=setInterval(()=>{time--;document.getElementById('time').textContent=time;if(time<=0){clearInterval(timer);running=false;document.getElementById('status').textContent='Score: '+score}},1000)}document.getElementById('start').onclick=start;</script></body></html>
