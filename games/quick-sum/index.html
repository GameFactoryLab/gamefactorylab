<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Quick Sum — 30 Second Math Sprint</title><meta name="description" content="Solve as many tiny sums as you can in 30 seconds. Free browser challenge."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(34px,9vw,56px)}.problem{text-align:center;font-size:clamp(52px,16vw,84px);font-weight:900;padding:24px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.answers button{font-size:26px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Quick Sum</h1><p class="muted">30 seconds. Pick the correct answer. Wrong answer costs 2 seconds.</p></section><section class="stats"><div class="card"><span class="muted">Score</span><strong id="score">0</strong></div><div class="card"><span class="muted">Time</span><strong id="time">30</strong></div><div class="card"><span class="muted">Best</span><strong id="best">0</strong></div></section><section class="card problem" id="problem">3 + 4</section><div class="answers" id="answers"></div><div id="status" class="status muted">Tap Start</div><div class="actions"><button id="start" class="btn primary">Start</button><button id="share" class="btn secondary" disabled>Share</button></div></main><script src="../../core.js"></script><script>(()=>{const G='quick-sum',p=document.getElementById('problem'),answers=document.getElementById('answers'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start'),share=document.getElementById('share');let answer=7,score=0,time=30,timer=null,running=false;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;function sh(a){return [...a].sort(()=>Math.random()-.5)}function round(){const max=score<8?10:score<18?20:40,a=1+Math.floor(Math.random()*max),b=1+Math.floor(Math.random()*max);answer=a+b;p.textContent=a+' + '+b;const opts=sh([answer,answer+1,Math.max(0,answer-1),answer+(Math.random()<.5?2:-2)]);answers.innerHTML=opts.map(n=>'<button class="btn secondary">'+n+'</button>').join('');[...answers.children].forEach(btn=>btn.onclick=()=>choose(+btn.textContent))}function choose(n){if(!running)return;if(n===answer){score++;scoreEl.textContent=score;GameFactory.event(G,'correct');round()}else{time=Math.max(0,time-2);timeEl.textContent=time;GameFactory.event(G,'wrong');if(time===0)finish()}}function begin(){clearInterval(timer);score=0;time=30;running=true;scoreEl.textContent='0';timeEl.textContent='30';share.disabled=true;status.textContent='Go!';GameFactory.event(G,'start');round();timer=setInterval(()=>{time--;timeEl.textContent=time;if(time<=0)finish()},1000)}function finish(){if(!running)return;running=false;clearInterval(timer);const s=GameFactory.score(G,score);bestEl.textContent=s.best||score;status.textContent='Time! Score '+score;share.disabled=false;GameFactory.event(G,'finish')}start.onclick=begin;share.onclick=async()=>{const r=await GameFactory.share(G,'Quick Sum',`I solved ${score} sums in 30 seconds. Can you beat me?`);if(r==='copied')status.textContent='Score link copied!'};round()})();</script></body></html>
