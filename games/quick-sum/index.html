<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Quick Sum — 30 Second Math Sprint</title>
<meta name="description" content="Solve as many tiny sums as you can in 30 seconds. Free browser challenge.">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}p{margin:4px 0 0;font-size:13px}.problem{text-align:center;font-size:clamp(48px,15vw,80px);font-weight:900;padding:18px 8px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.answers button{font-size:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stats .card{text-align:center}.stats strong{display:block;font-size:22px}.stats span{font-size:11px;text-transform:uppercase}.status{text-align:center;min-height:26px;font-weight:800}.actions,.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sharebox,.result{display:none}.sharebox.show,.result.show{display:block}.sharebox{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;font-size:13px;line-height:1.35;word-break:break-word}.sharebox strong{display:block;margin-bottom:5px}.result{text-align:center;border:1px solid rgba(52,211,153,.28);background:rgba(16,185,129,.08)}.result .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#86efac}.result strong{display:block;font-size:28px;margin:4px 0 10px}.result-actions .primary{grid-column:1/-1}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Quick Sum</h1><p class="muted">30 seconds. Pick the correct answer. Wrong answer costs 2 seconds.</p></section>
<section class="stats"><div class="card"><span class="muted">Score</span><strong id="score">0</strong></div><div class="card"><span class="muted">Time</span><strong id="time">30</strong></div><div class="card"><span class="muted">Best</span><strong id="best">0</strong></div></section>
<section class="card problem" id="problem">3 + 4</section>
<div class="answers" id="answers"></div>
<div id="status" class="status muted">Tap Start</div>
<section id="result" class="card result" aria-live="polite"><div class="eyebrow">Run complete</div><strong id="resultSummary">Score 0</strong><div class="result-actions"><button id="playAgain" type="button" class="btn primary">Play again</button><button id="resultShare" type="button" class="btn secondary">Share result</button><button id="resultText" type="button" class="btn secondary">Show share text</button></div></section>
<div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showShare" type="button" class="btn secondary" disabled>Show share text</button></div>
<div id="shareBox" class="sharebox" aria-live="polite"></div>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='quick-sum';
const el={problem:document.getElementById('problem'),answers:document.getElementById('answers'),score:document.getElementById('score'),time:document.getElementById('time'),best:document.getElementById('best'),status:document.getElementById('status'),start:document.getElementById('start'),end:document.getElementById('end'),share:document.getElementById('share'),showShare:document.getElementById('showShare'),shareBox:document.getElementById('shareBox'),result:document.getElementById('result'),resultSummary:document.getElementById('resultSummary'),playAgain:document.getElementById('playAgain'),resultShare:document.getElementById('resultShare'),resultText:document.getElementById('resultText')};
let answer=7,score=0,time=30,timer=null,running=false;
GameFactory.open(G);el.best.textContent=GameFactory.stats(G).best||0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function round(){const max=score<8?10:score<18?20:40,a=1+Math.floor(Math.random()*max),b=1+Math.floor(Math.random()*max);answer=a+b;el.problem.textContent=a+' + '+b;let opts=[answer,answer+1,Math.max(0,answer-1),answer+(Math.random()<.5?2:-2)];opts=[...new Set(opts)];while(opts.length<4){const n=Math.max(0,answer+Math.floor(Math.random()*9)-4);if(!opts.includes(n))opts.push(n)}shuffle(opts);el.answers.innerHTML='';opts.slice(0,4).forEach(n=>{const btn=document.createElement('button');btn.type='button';btn.className='btn secondary';btn.textContent=n;btn.addEventListener('click',()=>choose(n));el.answers.appendChild(btn)})}
function choose(n){if(!running)return;if(n===answer){score++;el.score.textContent=score;GameFactory.event(G,'correct');round()}else{time=Math.max(0,time-2);el.time.textContent=time;el.status.textContent='Wrong · -2 sec';GameFactory.event(G,'wrong');if(time===0)finish('Time!')}}
function begin(){clearInterval(timer);score=0;time=30;running=true;el.score.textContent='0';el.time.textContent='30';el.share.disabled=true;el.showShare.disabled=true;el.end.disabled=false;el.shareBox.classList.remove('show');el.shareBox.textContent='';el.result.classList.remove('show');el.status.textContent='Go!';el.start.textContent='Restart';GameFactory.event(G,'start');round();timer=setInterval(()=>{if(!running)return;time--;el.time.textContent=time;if(time<=0)finish('Time!')},1000)}
function finish(prefix){if(!running)return;running=false;clearInterval(timer);const s=GameFactory.score(G,score),best=s.best||score;el.best.textContent=best;el.status.textContent=`${prefix} Score ${score}. Best ${best}.`;el.resultSummary.textContent=`Score ${score} · Best ${best}`;el.result.classList.add('show');el.start.textContent='Play again';el.end.disabled=true;el.share.disabled=false;el.showShare.disabled=false;GameFactory.event(G,'finish');GameFactory.event(G,'result_view');setTimeout(()=>el.result.scrollIntoView({behavior:'smooth',block:'center'}),80)}
function shareText(){return `I solved ${score} sums in 30 seconds in Quick Sum. Can you beat me?`}
function manual(){el.shareBox.innerHTML='<strong>Share this score:</strong>'+shareText()+' '+GameFactory.challengeUrl(G,score);el.shareBox.classList.add('show');el.status.textContent='Use the text below to share your score.'}
async function doShare(source){if(source==='result')GameFactory.event(G,'result_share_click');const r=await GameFactory.share(G,'Quick Sum',shareText());if(r==='copied')el.status.textContent='Challenge link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='manual')manual()}
el.start.addEventListener('click',begin);el.playAgain.addEventListener('click',()=>{GameFactory.event(G,'replay_click');begin()});el.end.addEventListener('click',()=>{GameFactory.event(G,'manual_end');finish('Game ended.')});el.share.addEventListener('click',()=>doShare('toolbar'));el.resultShare.addEventListener('click',()=>doShare('result'));el.showShare.addEventListener('click',manual);el.resultText.addEventListener('click',()=>{GameFactory.event(G,'result_share_click');manual()});round();
})();
</script>
</body>
</html>
