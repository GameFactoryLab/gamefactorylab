<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Quick Sum — 30 Second Math Sprint</title><meta name="description" content="Solve as many tiny sums as you can in 30 seconds. Free browser challenge."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}p{margin:4px 0 0;font-size:13px}.problem{text-align:center;font-size:clamp(48px,15vw,80px);font-weight:900;padding:18px 8px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.answers button{font-size:24px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stats .card{text-align:center}.stats strong{display:block;font-size:22px}.stats span{font-size:11px;text-transform:uppercase}.status{text-align:center;min-height:26px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sharebox{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;font-size:13px;line-height:1.35;word-break:break-word}.sharebox.show{display:block}.sharebox strong{display:block;margin-bottom:5px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Quick Sum</h1><p class="muted">30 seconds. Pick the correct answer. Wrong answer costs 2 seconds.</p></section><section class="stats"><div class="card"><span class="muted">Score</span><strong id="score">0</strong></div><div class="card"><span class="muted">Time</span><strong id="time">30</strong></div><div class="card"><span class="muted">Best</span><strong id="best">0</strong></div></section><section class="card problem" id="problem">3 + 4</section><div class="answers" id="answers"></div><div id="status" class="status muted">Tap Start</div><div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showShare" type="button" class="btn secondary" disabled>Show share text</button></div><div id="shareBox" class="sharebox" aria-live="polite"></div></main><script src="../../core.js"></script><script>(()=>{const G='quick-sum',URL='https://gamefactorylab.github.io/gamefactorylab/games/quick-sum/',p=document.getElementById('problem'),answers=document.getElementById('answers'),scoreEl=document.getElementById('score'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start'),end=document.getElementById('end'),share=document.getElementById('share'),showShare=document.getElementById('showShare'),shareBox=document.getElementById('shareBox');let answer=7,score=0,time=30,timer=null,running=false;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function round(){const max=score<8?10:score<18?20:40,a=1+Math.floor(Math.random()*max),b=1+Math.floor(Math.random()*max);answer=a+b;p.textContent=a+' + '+b;let opts=[answer,answer+1,Math.max(0,answer-1),answer+(Math.random()<.5?2:-2)];opts=[...new Set(opts)];while(opts.length<4){const n=Math.max(0,answer+Math.floor(Math.random()*9)-4);if(!opts.includes(n))opts.push(n)}sh(opts);answers.innerHTML='';opts.slice(0,4).forEach(n=>{const btn=document.createElement('button');btn.type='button';btn.className='btn secondary';btn.textContent=n;btn.addEventListener('click',()=>choose(n));answers.appendChild(btn)})}function choose(n){if(!running)return;if(n===answer){score++;scoreEl.textContent=score;GameFactory.event(G,'correct');round()}else{time=Math.max(0,time-2);timeEl.textContent=time;status.textContent='Wrong · -2 sec';GameFactory.event(G,'wrong');if(time===0)finish('Time!')}}function begin(){clearInterval(timer);score=0;time=30;running=true;scoreEl.textContent='0';timeEl.textContent='30';share.disabled=true;showShare.disabled=true;end.disabled=false;shareBox.classList.remove('show');shareBox.textContent='';status.textContent='Go!';start.textContent='Restart';GameFactory.event(G,'start');round();timer=setInterval(()=>{if(!running)return;time--;timeEl.textContent=time;if(time<=0)finish('Time!')},1000)}function finish(prefix){if(!running)return;running=false;clearInterval(timer);const s=GameFactory.score(G,score);bestEl.textContent=s.best||score;status.textContent=prefix+' Score '+score+'.';end.disabled=true;share.disabled=false;showShare.disabled=false;GameFactory.event(G,'finish')}function shareText(){return `I solved ${score} sums in 30 seconds. Can you beat me?`}function manual(){shareBox.innerHTML='<strong>Share this score:</strong>'+shareText()+' '+URL;shareBox.classList.add('show');status.textContent='Use the text below to share your score.'}start.addEventListener('click',begin);end.addEventListener('click',()=>finish('Game ended.'));share.addEventListener('click',async()=>{const r=await GameFactory.share(G,'Quick Sum',shareText(),URL);if(r==='copied')status.textContent='Score link copied!';else if(r==='unsupported')manual()});showShare.addEventListener('click',manual);round()})();</script></body></html>
