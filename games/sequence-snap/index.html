<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Sequence Snap — Pattern Streak Challenge</title>
<meta name="description" content="Complete visual patterns and build the longest streak you can. Free browser pattern game.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/sequence-snap/">
<meta property="og:title" content="Sequence Snap — Pattern Streak Challenge">
<meta property="og:description" content="Complete the pattern, protect your streak, and challenge a friend.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/sequence-snap/">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}.seq,.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.cell,.opt{aspect-ratio:1;border:0;border-radius:14px;font-size:clamp(26px,9vw,40px);display:flex;align-items:center;justify-content:center}.cell{background:#f8fafc;color:#111827}.opt{background:#e2e8f0;color:#111827;cursor:pointer;min-width:0;-webkit-tap-highlight-color:transparent}.opt:active{transform:scale(.97)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stat{text-align:center}.stat b{display:block;font-size:22px}.status{text-align:center;min-height:26px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{min-height:44px}.danger{background:rgba(254,202,202,.12);color:#fecaca;border:1px solid rgba(254,202,202,.25)}.sharebox{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;font-size:13px;line-height:1.35;word-break:break-word}.sharebox.show{display:block}.sharebox strong{display:block;margin-bottom:5px}@media(max-width:360px){.app{gap:8px;padding-left:10px;padding-right:10px}.seq,.opts{gap:6px}.cell,.opt{border-radius:12px}.actions{gap:6px}}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Sequence Snap</h1><p class="muted">Complete the pattern. One wrong answer ends the streak.</p></section>
<section class="stats"><div class="card stat"><span class="muted">Streak</span><b id="score">0</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section>
<div class="card"><div id="seq" class="seq"></div></div>
<div id="opts" class="opts"></div>
<div id="status" class="status muted">Tap Start</div>
<div class="actions">
<button id="start" type="button" class="btn primary">Start</button>
<button id="end" type="button" class="btn danger" disabled>End streak</button>
<button id="share" type="button" class="btn secondary" disabled>Share score</button>
<button id="showShare" type="button" class="btn secondary" disabled>Show share text</button>
</div>
<div id="shareBox" class="sharebox" aria-live="polite"></div>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='sequence-snap',sy=['●','■','▲','◆','★','✚'],seq=document.getElementById('seq'),opts=document.getElementById('opts'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start'),end=document.getElementById('end'),share=document.getElementById('share'),showShare=document.getElementById('showShare'),shareBox=document.getElementById('shareBox');
let ans='',score=0,running=false;
GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;
function shuffle(a){return [...a].sort(()=>Math.random()-.5)}
function round(){
 const a=sy[Math.floor(Math.random()*sy.length)],pool=sy.filter(x=>x!==a),b=pool[Math.floor(Math.random()*pool.length)],mode=Math.floor(Math.random()*3),s=mode===0?[a,b,a,'?']:mode===1?[a,a,b,'?']:[a,b,b,'?'];
 ans=mode===0?b:a;
 seq.innerHTML=s.map(x=>'<div class="cell">'+x+'</div>').join('');
 opts.innerHTML=shuffle([ans,...shuffle(sy.filter(x=>x!==ans)).slice(0,3)]).map(x=>'<button type="button" class="opt">'+x+'</button>').join('');
 [...opts.children].forEach(btn=>btn.addEventListener('click',()=>pick(btn.textContent)));
}
function finish(prefix){
 if(!running)return;
 running=false;
 const s=GameFactory.score(G,score);
 bestEl.textContent=s.best||score;
 status.textContent=prefix+' Final streak: '+score+'.';
 end.disabled=true;share.disabled=false;showShare.disabled=false;
 GameFactory.event(G,'finish');
}
function pick(v){
 if(!running)return;
 if(v===ans){score++;scoreEl.textContent=score;status.textContent='Correct — keep going';GameFactory.event(G,'correct');round();}
 else finish('Wrong.');
}
function begin(){
 score=0;running=true;scoreEl.textContent='0';share.disabled=true;showShare.disabled=true;end.disabled=false;shareBox.classList.remove('show');shareBox.textContent='';status.textContent='Go!';start.textContent='Restart';GameFactory.event(G,'start');round();
}
function shareText(){return `I hit a ${score}-pattern streak in Sequence Snap. Can you beat it?`;}
function showManual(){shareBox.innerHTML='<strong>Share this score:</strong>'+shareText()+' '+location.href;shareBox.classList.add('show');status.textContent='Use the text below to share your score.';GameFactory.event(G,'share_manual');}
start.addEventListener('click',begin);
end.addEventListener('click',()=>finish('Streak ended.'));
share.addEventListener('click',async()=>{const r=await GameFactory.share(G,'Sequence Snap',shareText());if(r==='shared')status.textContent='Shared!';else if(r==='copied')status.textContent='Score link copied!';else if(r==='unsupported')showManual();});
showShare.addEventListener('click',showManual);
round();
})();
</script>
</body>
</html>
