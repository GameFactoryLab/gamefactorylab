<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Sequence Snap — Pattern Streak Challenge</title><meta name="description" content="Complete visual patterns and build the longest streak you can. Free browser pattern game."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(34px,9vw,56px)}.seq,.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cell,.opt{aspect-ratio:1;border:0;border-radius:16px;font-size:36px;display:flex;align-items:center;justify-content:center}.cell{background:#f8fafc;color:#111827}.opt{background:#e2e8f0;color:#111827;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:24px}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Sequence Snap</h1><p class="muted">Complete the pattern. One wrong answer ends the streak.</p></section><section class="stats"><div class="card stat"><span class="muted">Streak</span><b id="score">0</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section><div class="card"><div id="seq" class="seq"></div></div><div id="opts" class="opts"></div><div id="status" class="status muted">Tap Start</div><div class="actions"><button id="start" class="btn primary">Start</button><button id="share" class="btn secondary" disabled>Share</button></div></main><script src="../../core.js"></script><script>(()=>{const G='sequence-snap',sy=['●','■','▲','◆','★','✚'],seq=document.getElementById('seq'),opts=document.getElementById('opts'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start'),share=document.getElementById('share');let ans='',score=0,running=false;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;function sh(a){return [...a].sort(()=>Math.random()-.5)}function round(){const a=sy[Math.floor(Math.random()*sy.length)],pool=sy.filter(x=>x!==a),b=pool[Math.floor(Math.random()*pool.length)],mode=Math.floor(Math.random()*3),s=mode===0?[a,b,a,'?']:mode===1?[a,a,b,'?']:[a,b,b,'?'];ans=mode===0?b:a;seq.innerHTML=s.map(x=>'<div class="cell">'+x+'</div>').join('');opts.innerHTML=sh([ans,...sh(sy.filter(x=>x!==ans)).slice(0,3)]).map(x=>'<button class="opt">'+x+'</button>').join('');[...opts.children].forEach(btn=>btn.onclick=()=>pick(btn.textContent))}function pick(v){if(!running)return;if(v===ans){score++;scoreEl.textContent=score;status.textContent='Correct — keep going';GameFactory.event(G,'correct');round()}else{running=false;const s=GameFactory.score(G,score);bestEl.textContent=s.best||score;status.textContent='Wrong. Final streak: '+score;share.disabled=false;GameFactory.event(G,'finish')}}function begin(){score=0;running=true;scoreEl.textContent='0';share.disabled=true;status.textContent='Go!';GameFactory.event(G,'start');round()}start.onclick=begin;share.onclick=async()=>{const r=await GameFactory.share(G,'Sequence Snap',`I hit a ${score}-pattern streak in Sequence Snap. Can you beat it?`);if(r==='copied')status.textContent='Score link copied!'};round()})();</script></body></html>
