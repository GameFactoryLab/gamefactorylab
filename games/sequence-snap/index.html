<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sequence Snap</title><link rel="stylesheet" href="../../core.css"><style>.seq,.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.cell,.opt{aspect-ratio:1;border:0;border-radius:16px;font-size:36px;display:flex;align-items:center;justify-content:center}.cell{background:#f8fafc;color:#111827}.opt{background:#e2e8f0;color:#111827}.status{text-align:center;min-height:24px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><h1>Sequence Snap</h1><div class="card"><div id="seq" class="seq"></div></div><div id="opts" class="opts"></div><div id="status" class="status muted">Press Start</div><button id="start" class="btn primary">Start Game</button></main><script>const sy=['●','■','▲','◆','★','✚'];let ans='',score=0;function sh(a){return [...a].sort(()=>Math.random()-.5)}function round(){const a=sy[Math.floor(Math.random()*sy.length)],b=sy.filter(x=>x!==a)[Math.floor(Math.random()*(sy.length-1))];const mode=Math.floor(Math.random()*3),s=mode===0?[a,b,a,'?']:mode===1?[a,a,b,'?']:[a,b,b,'?'];ans=mode===0?b:a;seq.innerHTML=s.map(x=>'<div class="cell">'+x+'</div>').join('');opts.innerHTML=sh([ans,...sh(sy.filter(x=>x!==ans)).slice(0,3)]).map(x=>'<button class="opt">'+x+'</button>').join('');[...opts.children].forEach(btn=>btn.onclick=()=>{if(btn.textContent===ans){score++;status.textContent='Score: '+score;round()}else status.textContent='Try again'})}start.onclick=()=>{score=0;status.textContent='Go!';round()}</script></body></html>
