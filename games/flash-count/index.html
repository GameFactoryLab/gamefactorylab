<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Flash Count — Visual Memory Streak Challenge</title><meta name="description" content="Count the stars before they disappear and build the longest streak you can. Free browser memory game."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(34px,9vw,56px)}.box{min-height:240px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:center}.dot{font-size:34px;text-align:center}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:24px}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Flash Count</h1><p class="muted">Count the stars before they disappear. The flash gets faster as your streak grows.</p></section><section class="stats"><div class="card stat"><span class="muted">Streak</span><b id="score">0</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section><div class="card"><div id="box" class="box"></div></div><div id="answers" class="answers"></div><div id="status" class="status muted">Tap Start</div><div class="actions"><button id="start" class="btn primary">Start</button><button id="share" class="btn secondary" disabled>Share</button></div></main><script src="../../core.js"></script><script>(()=>{const G='flash-count',box=document.getElementById('box'),answers=document.getElementById('answers'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start'),share=document.getElementById('share');let ans=0,score=0,running=false,timer=null;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;function sh(a){return [...a].sort(()=>Math.random()-.5)}function flashMs(){return Math.max(380,900-score*45)}function round(){clearTimeout(timer);ans=3+Math.floor(Math.random()*6);const arr=Array(ans).fill('★').concat(Array(15-ans).fill('·'));box.innerHTML=sh(arr).map(x=>'<div class="dot">'+x+'</div>').join('');answers.innerHTML='';status.textContent='Count…';timer=setTimeout(()=>{if(!running)return;box.innerHTML='';const opts=sh([ans,Math.max(1,ans-1),ans+1]);answers.innerHTML=opts.map(n=>'<button class="btn secondary">'+n+'</button>').join('');[...answers.children].forEach(b=>b.onclick=()=>pick(+b.textContent));status.textContent='Choose'},flashMs())}function pick(v){if(!running)return;if(v===ans){score++;scoreEl.textContent=score;GameFactory.event(G,'correct');round()}else{finish()}}function finish(){if(!running)return;running=false;clearTimeout(timer);const s=GameFactory.score(G,score);bestEl.textContent=s.best||score;status.textContent='Wrong. Final streak: '+score;share.disabled=false;GameFactory.event(G,'finish')}function begin(){score=0;running=true;scoreEl.textContent='0';share.disabled=true;GameFactory.event(G,'start');round()}start.onclick=begin;share.onclick=async()=>{const r=await GameFactory.share(G,'Flash Count',`I hit a ${score}-round streak in Flash Count. Can you beat it?`);if(r==='copied')status.textContent='Score link copied!'};})();</script></body></html>
