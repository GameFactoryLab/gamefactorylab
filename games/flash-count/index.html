<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flash Count</title><link rel="stylesheet" href="../../core.css"><style>.box{min-height:240px;display:grid;grid-template-columns:repeat(5,1fr);gap:10px;align-items:center}.dot{font-size:34px;text-align:center}.answers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.status{text-align:center}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><h1>Flash Count</h1><p class="muted">Count the stars before they disappear.</p><div class="card"><div id="box" class="box"></div></div><div id="answers" class="answers"></div><div id="status" class="status muted">Press Start</div><button id="start" class="btn primary">Start</button></main><script>let ans=0,score=0;function sh(a){return [...a].sort(()=>Math.random()-.5)}function round(){ans=3+Math.floor(Math.random()*6);const arr=Array(ans).fill('★').concat(Array(15-ans).fill('·'));box.innerHTML=sh(arr).map(x=>'<div class="dot">'+x+'</div>').join('');answers.innerHTML='';setTimeout(()=>{box.innerHTML='';const opts=sh([ans,Math.max(1,ans-1),ans+1]);answers.innerHTML=opts.map(n=>'<button class="btn secondary">'+n+'</button>').join('');[...answers.children].forEach(b=>b.onclick=()=>{if(+b.textContent===ans){score++;status.textContent='Correct! Score '+score;round()}else status.textContent='Nope — '+ans})},900)}start.onclick=()=>{score=0;status.textContent='Go!';round()}</script></body></html>
