<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Flash Count — 30 Second Visual Memory Challenge</title>
<meta name="description" content="Count the target symbol before the board disappears. A free 30-second visual memory challenge from GameFactoryLab.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/flash-count/">
<meta property="og:title" content="Flash Count — 30 Second Visual Memory Challenge">
<meta property="og:description" content="Count the target before the board disappears. How many can you get in 30 seconds?">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/flash-count/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.stats .card{text-align:center}.stats strong{display:block;font-size:22px}.stats span{font-size:11px;text-transform:uppercase}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.cell{aspect-ratio:1;border-radius:11px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:clamp(20px,7vw,34px)}.question{text-align:center;min-height:27px;font-weight:800}.answers{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.answer{border:0;border-radius:13px;padding:14px 6px;font-size:22px;font-weight:900;background:#f8fafc;color:#111827;min-height:52px}.actions,.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:rgba(254,202,202,.12);color:#fecaca;border:1px solid rgba(254,202,202,.25)}.sharebox{display:none}.sharebox.show{display:block}.sharebox textarea{width:100%;min-height:88px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}.result{display:none;text-align:center}.result.show{display:block}.result h2{margin:0 0 6px;font-size:24px}.result-score{font-size:42px;font-weight:950;line-height:1}.result-meta{margin:6px 0 14px}@media(max-height:720px){.app{gap:8px}.card{padding:9px}.board{gap:5px}}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Flash Count</h1><p class="muted">Count the target before the board disappears. Wrong answer costs 2 seconds.</p></section>
<section class="stats"><div class="card"><span class="muted">Score</span><strong id="score">0</strong></div><div class="card"><span class="muted">Time</span><strong id="time">30</strong></div><div class="card"><span class="muted">Best</span><strong id="best">0</strong></div></section>
<section class="card"><div id="board" class="board"></div></section>
<div id="question" class="question muted">Tap Start</div>
<div id="answers" class="answers"></div>
<div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showText" type="button" class="btn secondary" disabled>Show share text</button></div>
<section id="result" class="card result" aria-live="polite"><h2>Run complete</h2><div id="resultScore" class="result-score">0 correct</div><div id="resultMeta" class="muted result-meta">Best 0</div><div class="result-actions"><button id="replay" class="btn primary" type="button">Play again</button><button id="resultShare" class="btn secondary" type="button">Share result</button></div></section>
<section id="shareBox" class="card sharebox"><label for="shareText" class="muted">Long-press to copy and share:</label><textarea id="shareText" readonly></textarea></section>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='flash-count',URL='https://gamefactorylab.github.io/gamefactorylab/games/flash-count/',symbols=['●','▲','■','◆'];
const el={board:document.getElementById('board'),question:document.getElementById('question'),answers:document.getElementById('answers'),score:document.getElementById('score'),time:document.getElementById('time'),best:document.getElementById('best'),start:document.getElementById('start'),end:document.getElementById('end'),share:document.getElementById('share'),showText:document.getElementById('showText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText'),result:document.getElementById('result'),resultScore:document.getElementById('resultScore'),resultMeta:document.getElementById('resultMeta'),replay:document.getElementById('replay'),resultShare:document.getElementById('resultShare')};
let score=0,time=30,running=false,target='',correct=0,locked=true,timer=null,revealTimer=null,nextTimer=null;
GameFactory.open(G);el.best.textContent=GameFactory.stats(G).best||0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function clearRoundTimers(){clearTimeout(revealTimer);clearTimeout(nextTimer)}
function revealDuration(){if(score<3)return 2200;if(score<6)return 1800;if(score<10)return 1450;if(score<15)return 1200;return 1000}
function round(){if(!running)return;clearRoundTimers();locked=true;el.answers.innerHTML='';target=symbols[Math.floor(Math.random()*symbols.length)];const arr=[];correct=0;for(let i=0;i<20;i++){const s=symbols[Math.floor(Math.random()*symbols.length)];arr.push(s);if(s===target)correct++}if(correct===0){const idx=Math.floor(Math.random()*arr.length);arr[idx]=target;correct=1}el.board.innerHTML=arr.map(s=>'<div class="cell">'+s+'</div>').join('');el.question.textContent='Count the '+target;revealTimer=setTimeout(()=>{if(!running)return;[...el.board.children].forEach(x=>x.textContent='');const vals=[correct,Math.max(0,correct-1),correct+1,correct+2];let opts=[...new Set(vals)];while(opts.length<4){const v=Math.max(0,correct+Math.floor(Math.random()*7)-3);if(!opts.includes(v))opts.push(v)}shuffle(opts);el.answers.innerHTML='';opts.slice(0,4).forEach(v=>{const b=document.createElement('button');b.type='button';b.className='answer';b.textContent=v;b.onclick=()=>choose(v,b);el.answers.appendChild(b)});el.question.textContent='How many '+target+'?';locked=false},revealDuration())}
function choose(v,b){if(!running||locked)return;locked=true;if(v===correct){score++;el.score.textContent=score;el.question.textContent='Correct!';b.style.opacity='.65';GameFactory.event(G,'correct')}else{time=Math.max(0,time-2);el.time.textContent=time;el.question.textContent='It was '+correct+' · -2 sec';b.style.opacity='.45';GameFactory.event(G,'wrong');if(time===0){finish('Time!');return}}nextTimer=setTimeout(round,500)}
function begin(){clearInterval(timer);clearRoundTimers();score=0;time=30;running=true;locked=true;el.score.textContent='0';el.time.textContent='30';el.question.textContent='Go!';el.end.disabled=false;el.share.disabled=true;el.showText.disabled=true;el.shareBox.classList.remove('show');el.result.classList.remove('show');el.start.textContent='Restart';GameFactory.event(G,'start');round();timer=setInterval(()=>{if(!running)return;time--;el.time.textContent=time;if(time<=0)finish('Time!')},1000)}
function finish(prefix){if(!running)return;running=false;locked=true;clearInterval(timer);clearRoundTimers();const s=GameFactory.score(G,score),best=s.best||score;el.best.textContent=best;el.end.disabled=true;el.share.disabled=false;el.showText.disabled=false;el.answers.innerHTML='';el.question.textContent=prefix+' Score: '+score+'. Best: '+best+'.';el.resultScore.textContent=score+' correct';el.resultMeta.textContent='Best '+best;el.result.classList.add('show');GameFactory.event(G,'finish');GameFactory.event(G,'result_view');setTimeout(()=>el.result.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'}),80)}
function text(){return `I scored ${score} in Flash Count. Can you beat me?`}
function show(){el.shareText.value=text()+' '+GameFactory.challengeUrl(G,score);el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
async function doShare(source){if(source)GameFactory.event(G,source);const r=await GameFactory.share(G,'Flash Count',text(),URL);if(r==='copied')el.question.textContent='Challenge link copied!';else if(r==='shared')el.question.textContent='Shared!';else if(r==='manual'||r==='unsupported')show()}
el.start.onclick=begin;el.end.onclick=()=>{GameFactory.event(G,'manual_end');finish('Game ended.')};el.share.onclick=()=>doShare('share_click');el.showText.onclick=show;el.replay.onclick=()=>{GameFactory.event(G,'replay_click');begin()};el.resultShare.onclick=()=>doShare('result_share_click');el.board.innerHTML=Array.from({length:20},()=>'<div class="cell">•</div>').join('');
})();
</script>
</body>
</html>
