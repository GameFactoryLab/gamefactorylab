<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Number Hunt — 30 Second Visual Search Challenge</title>
<meta name="description" content="Find and tap the numbers in order as fast as you can. A free 30-second visual search challenge from GameFactoryLab.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/number-hunt/">
<meta property="og:title" content="Number Hunt — 30 Second Visual Search Challenge">
<meta property="og:description" content="Tap 1, 2, 3… in order. How many can you find in 30 seconds?">
<meta property="og:type" content="website"><meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/number-hunt/"><meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:10px}.stat span{font-size:11px;text-transform:uppercase}.stat b{display:block;font-size:22px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;touch-action:manipulation;margin:auto}.tile{aspect-ratio:1;border:0;border-radius:14px;background:#f8fafc;color:#111827;font-size:clamp(22px,7vw,34px);font-weight:900;cursor:pointer;-webkit-tap-highlight-color:transparent}.tile:active{transform:scale(.97)}.tile.done{opacity:.14;pointer-events:none}.target{text-align:center;font-size:14px}.target strong{font-size:32px;display:block}.status{text-align:center;min-height:26px;font-weight:800}.actions,.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:rgba(254,202,202,.12);color:#fecaca;border:1px solid rgba(254,202,202,.25)}.sharebox,.result{display:none}.sharebox.show,.result.show{display:block}.result{text-align:center;border:1px solid rgba(52,211,153,.28);background:rgba(16,185,129,.08)}.result .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#86efac}.result strong{display:block;font-size:28px;margin:4px 0 10px}.result-actions .primary{grid-column:1/-1}.sharebox textarea{width:100%;min-height:88px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}@media(max-height:720px){.app{gap:5px;padding:7px}.card{padding:7px}.stats{gap:5px}.stats .card{padding:6px}.stat b{font-size:19px}.target{padding:5px}.target strong{font-size:25px}.board{width:min(100%,42vh);gap:4px}.tile{border-radius:9px;font-size:clamp(18px,6vw,28px)}.actions{gap:5px}.btn{padding:9px}section>h1{font-size:30px}section>p{font-size:12px;margin:3px 0}}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Number Hunt</h1><p class="muted">Tap the numbers in order. 30 seconds. Wrong tap costs 1 second.</p></section>
<section class="stats"><div class="card stat"><span class="muted">Score</span><b id="score">0</b></div><div class="card stat"><span class="muted">Time</span><b id="time">30</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section>
<section class="card target"><span class="muted">Find next</span><strong id="target">1</strong></section>
<section class="card"><div id="board" class="board"></div></section>
<div id="status" class="status muted">Tap Start</div>
<section id="result" class="card result" aria-live="polite"><div class="eyebrow">Run complete</div><strong id="resultSummary">Score 0</strong><div class="result-actions"><button id="playAgain" type="button" class="btn primary">Play again</button><button id="resultShare" type="button" class="btn secondary">Share result</button><button id="resultText" type="button" class="btn secondary">Show share text</button></div></section>
<div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showText" type="button" class="btn secondary" disabled>Show share text</button></div>
<section id="shareBox" class="card sharebox"><label for="shareText" class="muted">Long-press to copy and share:</label><textarea id="shareText" readonly></textarea></section>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='number-hunt',SIZE=16;
const el={board:document.getElementById('board'),score:document.getElementById('score'),time:document.getElementById('time'),best:document.getElementById('best'),target:document.getElementById('target'),status:document.getElementById('status'),start:document.getElementById('start'),end:document.getElementById('end'),share:document.getElementById('share'),showText:document.getElementById('showText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText'),result:document.getElementById('result'),resultSummary:document.getElementById('resultSummary'),playAgain:document.getElementById('playAgain'),resultShare:document.getElementById('resultShare'),resultText:document.getElementById('resultText')};
let score=0,time=30,next=1,running=false,timer=null;
GameFactory.open(G);el.best.textContent=GameFactory.stats(G).best||0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function newBoard(){next=1;el.target.textContent='1';el.board.innerHTML='';shuffle(Array.from({length:SIZE},(_,i)=>i+1)).forEach(n=>{const b=document.createElement('button');b.type='button';b.className='tile';b.textContent=n;b.setAttribute('aria-label','Number '+n);b.onclick=()=>pick(n,b);el.board.appendChild(b)})}
function pick(n,b){if(!running)return;if(n===next){score++;el.score.textContent=score;b.classList.add('done');GameFactory.event(G,'correct');next++;if(next>SIZE){el.status.textContent='Board cleared!';setTimeout(()=>{if(running)newBoard()},120)}else el.target.textContent=next}else{time=Math.max(0,time-1);el.time.textContent=time;el.status.textContent='Wrong · -1 sec';GameFactory.event(G,'wrong');if(time===0)finish('Time!')}}
function begin(){clearInterval(timer);score=0;time=30;running=true;el.score.textContent='0';el.time.textContent='30';el.status.textContent='Go!';el.start.textContent='Restart';el.end.disabled=false;el.share.disabled=true;el.showText.disabled=true;el.shareBox.classList.remove('show');el.result.classList.remove('show');GameFactory.event(G,'start');newBoard();timer=setInterval(()=>{if(!running)return;time--;el.time.textContent=time;if(time<=0)finish('Time!')},1000)}
function finish(prefix){if(!running)return;running=false;clearInterval(timer);const s=GameFactory.score(G,score),best=s.best||score;el.best.textContent=best;el.status.textContent=`${prefix} Score: ${score}. Best: ${best}.`;el.resultSummary.textContent=`Score ${score} · Best ${best}`;el.result.classList.add('show');el.start.textContent='Play again';el.end.disabled=true;el.share.disabled=false;el.showText.disabled=false;GameFactory.event(G,'finish');setTimeout(()=>el.result.scrollIntoView({behavior:'smooth',block:'center'}),80)}
function text(){return `I found ${score} numbers in 30 seconds in Number Hunt. Can you beat me?`}
function show(){el.shareText.value=text()+' '+GameFactory.challengeUrl(G,score);el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
async function doShare(){const r=await GameFactory.share(G,'Number Hunt',text());if(r==='copied')el.status.textContent='Challenge link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='manual')show()}
el.start.onclick=begin;el.playAgain.onclick=begin;el.end.onclick=()=>{GameFactory.event(G,'manual_end');finish('Game ended.')};el.share.onclick=doShare;el.resultShare.onclick=doShare;el.showText.onclick=show;el.resultText.onclick=show;newBoard();
})();
</script>
</body>
</html>
