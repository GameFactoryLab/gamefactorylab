<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Memory Path — Quick Recall Challenge</title><meta name="description" content="Watch the tiles flash, then repeat the pattern. Free browser memory challenge."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}p{margin:4px 0 0;font-size:13px}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{aspect-ratio:1;border:0;border-radius:14px;background:#e2e8f0;cursor:pointer;touch-action:manipulation}.tile.on{background:#bbf7d0;transform:scale(.96)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.stats .card{text-align:center}.stats strong{display:block;font-size:22px}.stats span{font-size:11px;text-transform:uppercase}.status{text-align:center;min-height:26px;font-weight:800}.actions,.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.sharebox{display:none;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:10px;font-size:13px;line-height:1.35;word-break:break-word}.sharebox.show{display:block}.sharebox strong{display:block;margin-bottom:5px}.result{display:none;text-align:center}.result.show{display:block}.result h2{margin:0 0 6px;font-size:24px}.result-score{font-size:42px;font-weight:950;line-height:1}.result-meta{margin:6px 0 14px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Memory Path</h1><p class="muted">Watch the sequence. Repeat it. One mistake ends the run.</p></section><section class="stats"><div class="card"><span class="muted">Round</span><strong id="round">0</strong></div><div class="card"><span class="muted">Best</span><strong id="best">0</strong></div></section><section class="card"><div id="board" class="board"></div></section><div id="status" class="status muted">Tap Start</div><div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End run</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showShare" type="button" class="btn secondary" disabled>Show share text</button></div><section id="result" class="card result" aria-live="polite"><h2>Run complete</h2><div id="resultScore" class="result-score">Round 0</div><div id="resultMeta" class="muted result-meta">Best 0</div><div class="result-actions"><button id="replay" class="btn primary" type="button">Play again</button><button id="resultShare" class="btn secondary" type="button">Share result</button></div></section><div id="shareBox" class="sharebox" aria-live="polite"></div></main><script src="../../core.js"></script><script>(()=>{const G='memory-path',URL='https://gamefactorylab.github.io/gamefactorylab/games/memory-path/',board=document.getElementById('board'),roundEl=document.getElementById('round'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start'),end=document.getElementById('end'),share=document.getElementById('share'),showShare=document.getElementById('showShare'),shareBox=document.getElementById('shareBox'),result=document.getElementById('result'),resultScore=document.getElementById('resultScore'),resultMeta=document.getElementById('resultMeta'),replay=document.getElementById('replay'),resultShare=document.getElementById('resultShare');let seq=[],input=[],locked=true,running=false,runToken=0;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;for(let i=0;i<9;i++){const b=document.createElement('button');b.type='button';b.className='tile';b.setAttribute('aria-label','memory tile '+(i+1));b.addEventListener('click',()=>tap(i,b));board.appendChild(b)}const tiles=[...board.children],sleep=ms=>new Promise(r=>setTimeout(r,ms));async function showSeq(token){locked=true;status.textContent='Watch';await sleep(300);for(const i of seq){if(!running||token!==runToken)return;tiles[i].classList.add('on');await sleep(300);tiles[i].classList.remove('on');await sleep(150)}if(!running||token!==runToken)return;input=[];locked=false;status.textContent='Your turn'}async function next(token){if(!running||token!==runToken)return;seq.push(Math.floor(Math.random()*9));roundEl.textContent=seq.length;GameFactory.event(G,'round');await showSeq(token)}function scoreNow(){return Math.max(0,seq.length-1)}function finish(prefix,score=scoreNow()){if(!running)return;running=false;locked=true;runToken++;tiles.forEach(t=>t.classList.remove('on'));const s=GameFactory.score(G,score),best=s.best||score;bestEl.textContent=best;status.textContent=prefix+' You reached '+score+'.';end.disabled=true;share.disabled=false;showShare.disabled=false;resultScore.textContent='Round '+score;resultMeta.textContent='Best '+best;result.classList.add('show');GameFactory.event(G,'finish');GameFactory.event(G,'result_view');setTimeout(()=>result.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'}),80)}function tap(i,b){if(locked||!running)return;b.classList.add('on');setTimeout(()=>b.classList.remove('on'),120);const pos=input.length;if(i!==seq[pos]){GameFactory.event(G,'miss');finish('Miss!');return}input.push(i);GameFactory.event(G,'correct_tap');if(input.length===seq.length){locked=true;GameFactory.event(G,'round_clear');const token=runToken;setTimeout(()=>next(token),400)}}function begin(){runToken++;const token=runToken;seq=[];input=[];running=true;locked=true;roundEl.textContent='0';share.disabled=true;showShare.disabled=true;end.disabled=false;shareBox.classList.remove('show');shareBox.textContent='';result.classList.remove('show');status.textContent='Get ready';start.textContent='Restart';GameFactory.event(G,'start');next(token)}function shareText(){const score=scoreNow();return `I reached round ${score} in Memory Path. Can you beat me?`}function manual(){shareBox.innerHTML='<strong>Share this score:</strong>'+shareText()+' '+URL;shareBox.classList.add('show');status.textContent='Use the text below to share your score.'}async function doShare(source){if(source)GameFactory.event(G,source);const r=await GameFactory.share(G,'Memory Path',shareText(),URL);if(r==='copied')status.textContent='Score link copied!';else if(r==='shared')status.textContent='Shared!';else if(r==='manual'||r==='unsupported')manual()}start.addEventListener('click',begin);end.addEventListener('click',()=>{GameFactory.event(G,'manual_end');finish('Run ended.')});share.addEventListener('click',()=>doShare('share_click'));showShare.addEventListener('click',manual);replay.addEventListener('click',()=>{GameFactory.event(G,'replay_click');begin()});resultShare.addEventListener('click',()=>doShare('result_share_click'))})();</script></body></html>
