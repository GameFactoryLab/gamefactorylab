<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Memory Path — Quick Recall Challenge</title><meta name="description" content="Watch the tiles flash, then repeat the pattern. Free browser memory challenge."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(34px,9vw,56px)}.board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.tile{aspect-ratio:1;border:0;border-radius:16px;background:#e2e8f0;cursor:pointer}.tile.on{background:#bbf7d0;transform:scale(.96)}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Memory Path</h1><p class="muted">Watch the sequence. Repeat it. One mistake ends the run.</p></section><section class="stats"><div class="card"><span class="muted">Round</span><strong id="round">0</strong></div><div class="card"><span class="muted">Best</span><strong id="best">0</strong></div></section><section class="card"><div id="board" class="board"></div></section><div id="status" class="status muted">Tap Start</div><div class="actions"><button id="start" class="btn primary">Start</button><button id="share" class="btn secondary" disabled>Share</button></div></main><script src="../../core.js"></script><script>(()=>{const G='memory-path',board=document.getElementById('board'),roundEl=document.getElementById('round'),bestEl=document.getElementById('best'),status=document.getElementById('status'),start=document.getElementById('start'),share=document.getElementById('share');let seq=[],input=[],locked=true;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;for(let i=0;i<9;i++){const b=document.createElement('button');b.className='tile';b.onclick=()=>tap(i,b);board.appendChild(b)}const tiles=[...board.children];const sleep=ms=>new Promise(r=>setTimeout(r,ms));async function showSeq(){locked=true;status.textContent='Watch';await sleep(350);for(const i of seq){tiles[i].classList.add('on');await sleep(350);tiles[i].classList.remove('on');await sleep(180)}input=[];locked=false;status.textContent='Your turn'}async function next(){seq.push(Math.floor(Math.random()*9));roundEl.textContent=seq.length;GameFactory.event(G,'round');await showSeq()}function tap(i,b){if(locked)return;b.classList.add('on');setTimeout(()=>b.classList.remove('on'),120);const pos=input.length;if(i!==seq[pos]){locked=true;const score=Math.max(0,seq.length-1),s=GameFactory.score(G,score);bestEl.textContent=s.best||score;status.textContent='Miss! You reached '+score;share.disabled=false;GameFactory.event(G,'finish');return}input.push(i);if(input.length===seq.length){locked=true;setTimeout(next,450)}}start.onclick=()=>{seq=[];input=[];roundEl.textContent='0';share.disabled=true;status.textContent='Get ready';GameFactory.event(G,'start');next()};share.onclick=async()=>{const score=Math.max(0,seq.length-1),r=await GameFactory.share(G,'Memory Path',`I reached round ${score} in Memory Path. Can you beat me?`);if(r==='copied')status.textContent='Score link copied!'};})();</script></body></html>
