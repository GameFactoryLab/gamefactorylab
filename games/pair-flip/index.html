<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Pair Flip — Fast Memory Match Challenge</title>
<meta name="description" content="Flip cards, find matching symbol pairs, and clear as many boards as you can in 45 seconds. A free memory challenge from GameFactoryLab.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/pair-flip/">
<meta property="og:title" content="Pair Flip — Fast Memory Match Challenge">
<meta property="og:description" content="Find the matching pairs before the clock runs out, then challenge a friend to beat your score.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/pair-flip/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:10px}.stat span{font-size:11px;text-transform:uppercase}.stat b{display:block;font-size:22px}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{aspect-ratio:1;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.08);color:#f8fafc;font-size:clamp(25px,9vw,42px);font-weight:900;display:flex;align-items:center;justify-content:center;touch-action:manipulation;transition:transform .12s ease,background .12s ease}.tile:active{transform:scale(.97)}.tile.revealed{background:#f8fafc;color:#111827}.tile.matched{background:rgba(187,247,208,.14);color:#bbf7d0;border-color:rgba(187,247,208,.28)}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:rgba(254,202,202,.12);color:#fecaca;border:1px solid rgba(254,202,202,.25)}.sharebox{display:none}.sharebox.show{display:block}.sharebox textarea{width:100%;min-height:88px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}.result{display:none;text-align:center}.result.show{display:block}.result-score{font-size:clamp(34px,10vw,54px);font-weight:900;margin:6px 0}.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.result-actions .primary{grid-column:1/-1}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Pair Flip</h1><p class="muted">Find matching pairs for 45 seconds. Clear a full board for a 4-point bonus.</p></section>
<section class="stats"><div class="card stat"><span class="muted">Score</span><b id="score">0</b></div><div class="card stat"><span class="muted">Time</span><b id="time">45</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section>
<section class="card"><div id="board" class="board" aria-label="Memory matching board"></div></section>
<div id="status" class="status muted">Tap Start</div>
<div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showText" type="button" class="btn secondary" disabled>Show share text</button></div>
<section id="result" class="card result" aria-live="polite"><div class="muted">Run complete</div><div class="result-score"><span id="finalScore">0</span> points</div><p class="muted">Best: <strong id="resultBest">0</strong></p><div class="result-actions"><button id="replay" type="button" class="btn primary">Play again</button><button id="resultShare" type="button" class="btn secondary">Share result</button><button id="resultShowText" type="button" class="btn secondary">Show share text</button></div></section>
<section id="shareBox" class="card sharebox"><label for="shareText" class="muted">Long-press to copy and share:</label><textarea id="shareText" readonly></textarea></section>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='pair-flip';
const symbols=['●','▲','■','◆','★','✚','✦','⬟'];
const el={board:document.getElementById('board'),score:document.getElementById('score'),time:document.getElementById('time'),best:document.getElementById('best'),status:document.getElementById('status'),start:document.getElementById('start'),end:document.getElementById('end'),share:document.getElementById('share'),showText:document.getElementById('showText'),result:document.getElementById('result'),finalScore:document.getElementById('finalScore'),resultBest:document.getElementById('resultBest'),replay:document.getElementById('replay'),resultShare:document.getElementById('resultShare'),resultShowText:document.getElementById('resultShowText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText')};
let score=0,time=45,running=false,locked=true,timer=null,first=null,matched=0,boardNo=0;
GameFactory.open(G);el.best.textContent=GameFactory.stats(G).best||0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function makeBoard(){first=null;matched=0;locked=false;boardNo++;const deck=shuffle([...symbols,...symbols].map((symbol,i)=>({symbol,key:i})));el.board.innerHTML='';deck.forEach((card,idx)=>{const b=document.createElement('button');b.type='button';b.className='tile';b.dataset.symbol=card.symbol;b.dataset.index=idx;b.setAttribute('aria-label','Hidden card');b.textContent='?';b.onclick=()=>flip(b);el.board.appendChild(b)});el.status.textContent=boardNo===1?'Find the pairs!':'New board — keep going!'}
function reveal(b){b.classList.add('revealed');b.textContent=b.dataset.symbol;b.setAttribute('aria-label',b.dataset.symbol)}
function hide(b){b.classList.remove('revealed');b.textContent='?';b.setAttribute('aria-label','Hidden card')}
function flip(b){if(!running||locked||b.classList.contains('matched')||b===first)return;reveal(b);if(!first){first=b;return}locked=true;const a=first;first=null;if(a.dataset.symbol===b.dataset.symbol){a.classList.remove('revealed');b.classList.remove('revealed');a.classList.add('matched');b.classList.add('matched');matched+=2;score++;el.score.textContent=score;el.status.textContent='Match!';GameFactory.event(G,'match');if(matched===16){score+=4;el.score.textContent=score;GameFactory.event(G,'board_clear');setTimeout(()=>{if(running)makeBoard()},360)}else{locked=false}}else{GameFactory.event(G,'miss');el.status.textContent='Not a pair';setTimeout(()=>{hide(a);hide(b);locked=false;if(running)el.status.textContent='Keep looking'},420)}}
function begin(){clearInterval(timer);score=0;time=45;boardNo=0;running=true;locked=true;first=null;matched=0;el.score.textContent='0';el.time.textContent='45';el.status.textContent='Go!';el.start.textContent='Restart';el.end.disabled=false;el.share.disabled=true;el.showText.disabled=true;el.result.classList.remove('show');el.shareBox.classList.remove('show');GameFactory.event(G,'start');makeBoard();timer=setInterval(()=>{if(!running)return;time--;el.time.textContent=time;if(time<=0)finish('Time!')},1000)}
function finish(prefix){if(!running)return;running=false;locked=true;clearInterval(timer);const s=GameFactory.score(G,score);const best=s.best||score;el.best.textContent=best;el.finalScore.textContent=score;el.resultBest.textContent=best;el.status.textContent=`${prefix} Score: ${score}. Best: ${best}.`;el.end.disabled=true;el.share.disabled=false;el.showText.disabled=false;el.result.classList.add('show');GameFactory.event(G,'finish');requestAnimationFrame(()=>el.result.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}))}
function text(){return `I scored ${score} in Pair Flip. Can you beat me?`}
function show(track=false){if(track)GameFactory.event(G,'result_share_click');el.shareText.value=text()+' '+GameFactory.challengeUrl(G,score);el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
async function shareResult(){GameFactory.event(G,'result_share_click');const r=await GameFactory.share(G,'Pair Flip',text());if(r==='copied')el.status.textContent='Challenge link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='manual')show()}
el.start.onclick=begin;el.end.onclick=()=>{GameFactory.event(G,'manual_end');finish('Game ended.')};el.share.onclick=async()=>{const r=await GameFactory.share(G,'Pair Flip',text());if(r==='copied')el.status.textContent='Challenge link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='manual')show()};el.showText.onclick=()=>show();el.replay.onclick=()=>{GameFactory.event(G,'replay_click');begin()};el.resultShare.onclick=shareResult;el.resultShowText.onclick=()=>show(true);
makeBoard();locked=true;
})();
</script>
</body>
</html>
