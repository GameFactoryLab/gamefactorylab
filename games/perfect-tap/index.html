<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfect Tap</title><link rel="stylesheet" href="../../core.css"><style>.track{height:44px;border-radius:22px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}.zone{position:absolute;left:42%;width:16%;top:0;bottom:0;background:rgba(187,247,208,.35)}.bar{position:absolute;width:8px;top:0;bottom:0;background:#f8fafc}.status{text-align:center}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><h1>Perfect Tap</h1><div class="card"><div class="track"><div class="zone"></div><div id="bar" class="bar"></div></div></div><div id="status" class="status muted">Tap when the line is inside the target.</div><button id="tap" class="btn primary">Tap</button></main><script>let x=0,d=1,score=0;setInterval(()=>{x+=d*1.7;if(x>=99||x<=0)d*=-1;bar.style.left=x+'%'},16);tap.onclick=()=>{if(x>=42&&x<=58){score++;status.textContent='Perfect! Score '+score}else{score=0;status.textContent='Miss — score reset'}}</script></body></html>
