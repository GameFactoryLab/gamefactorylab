<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Perfect Tap — Timing Streak Challenge</title><meta name="description" content="Stop the moving line inside the target and build the longest timing streak you can. Free browser game."><link rel="stylesheet" href="../../core.css"><style>h1{margin:0;font-size:clamp(34px,9vw,56px)}.track{height:54px;border-radius:27px;background:rgba(255,255,255,.1);position:relative;overflow:hidden}.zone{position:absolute;left:42%;width:16%;top:0;bottom:0;background:rgba(187,247,208,.35)}.bar{position:absolute;width:8px;top:0;bottom:0;background:#f8fafc}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.stat{text-align:center}.stat b{display:block;font-size:24px}.status{text-align:center;min-height:28px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}</style></head><body><main class="app"><a href="../../index.html" class="muted">← GameFactoryLab</a><section><h1>Perfect Tap</h1><p class="muted">Tap inside the green zone. One miss ends the streak and the bar speeds up.</p></section><section class="stats"><div class="card stat"><span class="muted">Streak</span><b id="score">0</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section><div class="card"><div class="track"><div class="zone"></div><div id="bar" class="bar"></div></div></div><div id="status" class="status muted">Tap Start</div><button id="tap" class="btn primary" disabled>Tap</button><div class="actions"><button id="start" class="btn secondary">Start / Restart</button><button id="share" class="btn secondary" disabled>Share</button></div></main><script src="../../core.js"></script><script>(()=>{const G='perfect-tap',bar=document.getElementById('bar'),scoreEl=document.getElementById('score'),bestEl=document.getElementById('best'),status=document.getElementById('status'),tap=document.getElementById('tap'),start=document.getElementById('start'),share=document.getElementById('share');let x=0,d=1,score=0,running=false,speed=1.7;GameFactory.open(G);bestEl.textContent=GameFactory.stats(G).best||0;setInterval(()=>{x+=d*speed;if(x>=99){x=99;d=-1}else if(x<=0){x=0;d=1}bar.style.left=x+'%'},16);function begin(){score=0;speed=1.7;running=true;scoreEl.textContent='0';tap.disabled=false;share.disabled=true;status.textContent='Go!';GameFactory.event(G,'start')}function hit(){if(!running)return;if(x>=42&&x<=58){score++;speed=Math.min(4.2,1.7+score*.12);scoreEl.textContent=score;status.textContent='Perfect — faster now';GameFactory.event(G,'correct')}else{running=false;tap.disabled=true;const s=GameFactory.score(G,score);bestEl.textContent=s.best||score;status.textContent='Miss. Final streak: '+score;share.disabled=false;GameFactory.event(G,'finish')}}start.onclick=begin;tap.onclick=hit;share.onclick=async()=>{const r=await GameFactory.share(G,'Perfect Tap',`I hit a ${score}-tap timing streak in Perfect Tap. Can you beat it?`);if(r==='copied')status.textContent='Score link copied!'};})();</script></body></html>
