<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Direction Switch — Cognitive Flexibility Challenge</title>
<meta name="description" content="Follow the arrow or reverse it when the rule changes. A free 30-second cognitive-flexibility challenge from GameFactoryLab.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/direction-switch/">
<meta property="og:title" content="Direction Switch — Cognitive Flexibility Challenge">
<meta property="og:description" content="Follow or reverse? The rule changes while the arrow keeps moving. How many can you get right in 30 seconds?">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/direction-switch/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:10px}.stat span{font-size:11px;text-transform:uppercase}.stat b{display:block;font-size:22px}.rule-card{text-align:center;padding:16px}.rule{display:inline-block;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.09);font-size:13px;font-weight:900;letter-spacing:.05em}.arrow{display:block;font-size:clamp(96px,31vw,154px);font-weight:900;line-height:1;margin-top:8px}.choices{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.choice{min-height:78px;border:0;border-radius:16px;background:#f8fafc;color:#111827;font-size:35px;font-weight:900;touch-action:manipulation}.status{text-align:center;min-height:44px;font-weight:800}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:rgba(254,202,202,.12);color:#fecaca;border:1px solid rgba(254,202,202,.25)}.sharebox{display:none}.sharebox.show{display:block}.sharebox textarea{width:100%;min-height:88px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}@media(max-width:360px){.choice{font-size:30px;min-height:70px}}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Direction Switch</h1><p class="muted">FOLLOW means tap the arrow direction. REVERSE means tap the opposite. Wrong answers cost 2 seconds.</p></section>
<section class="stats"><div class="card stat"><span class="muted">Score</span><b id="score">0</b></div><div class="card stat"><span class="muted">Time</span><b id="time">30</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section>
<section class="card rule-card"><strong id="rule" class="rule">FOLLOW</strong><span id="arrow" class="arrow">→</span></section>
<section class="choices"><button type="button" class="choice" data-dir="0">↑</button><button type="button" class="choice" data-dir="1">→</button><button type="button" class="choice" data-dir="2">↓</button><button type="button" class="choice" data-dir="3">←</button></section>
<div id="status" class="status muted">Tap Start, then obey the rule shown above the arrow.</div>
<div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showText" type="button" class="btn secondary" disabled>Show share text</button></div>
<section id="shareBox" class="card sharebox"><label for="shareText" class="muted">Long-press to copy and share:</label><textarea id="shareText" readonly></textarea></section>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='direction-switch',ARROWS=['↑','→','↓','←'];
const el={rule:document.getElementById('rule'),arrow:document.getElementById('arrow'),score:document.getElementById('score'),time:document.getElementById('time'),best:document.getElementById('best'),status:document.getElementById('status'),start:document.getElementById('start'),end:document.getElementById('end'),share:document.getElementById('share'),showText:document.getElementById('showText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText')};
let score=0,time=30,running=false,locked=true,dir=1,reverse=false,timer=null,nextTimer=null,lastKey='';
GameFactory.open(G);el.best.textContent=GameFactory.stats(G).best||0;
function next(){if(!running)return;let key;do{dir=Math.floor(Math.random()*4);reverse=Math.random()<(score<5?.3:.5);key=dir+'-'+reverse}while(key===lastKey);lastKey=key;el.rule.textContent=reverse?'REVERSE':'FOLLOW';el.arrow.textContent=ARROWS[dir];el.status.textContent=reverse?'Tap the opposite direction':'Tap the arrow direction';locked=false}
function choose(chosen){if(!running||locked)return;locked=true;const target=reverse?(dir+2)%4:dir;if(chosen===target){score++;el.score.textContent=score;el.status.textContent='Correct!';GameFactory.event(G,'correct')}else{time=Math.max(0,time-2);el.time.textContent=time;el.status.textContent='Wrong · -2 sec';GameFactory.event(G,'wrong');if(time===0){finish('Time!');return}}nextTimer=setTimeout(next,130)}
function begin(){clearInterval(timer);clearTimeout(nextTimer);score=0;time=30;running=true;locked=true;lastKey='';el.score.textContent='0';el.time.textContent='30';el.start.textContent='Restart';el.end.disabled=false;el.share.disabled=true;el.showText.disabled=true;el.shareBox.classList.remove('show');GameFactory.event(G,'start');next();timer=setInterval(()=>{if(!running)return;time--;el.time.textContent=time;if(time<=0)finish('Time!')},1000)}
function finish(prefix){if(!running)return;running=false;locked=true;clearInterval(timer);clearTimeout(nextTimer);const s=GameFactory.score(G,score);el.best.textContent=s.best||score;el.status.textContent=`${prefix} Score: ${score}. Best: ${s.best||score}.`;el.end.disabled=true;el.share.disabled=false;el.showText.disabled=false;GameFactory.event(G,'finish')}
function text(){return `I scored ${score} in Direction Switch. Follow or reverse the arrow and try to beat me.`}
function show(){el.shareText.value=text()+' '+GameFactory.challengeUrl(G,score);el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
document.querySelectorAll('.choice').forEach(b=>b.addEventListener('click',()=>choose(Number(b.dataset.dir))));el.start.onclick=begin;el.end.onclick=()=>{GameFactory.event(G,'manual_end');finish('Game ended.')};el.share.onclick=async()=>{const r=await GameFactory.share(G,'Direction Switch',text());if(r==='copied')el.status.textContent='Challenge link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='manual')show()};el.showText.onclick=show;
})();
</script>
</body>
</html>
