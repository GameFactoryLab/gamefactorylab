<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111827">
<title>Parity Rush — Odd or Even Speed Challenge</title>
<meta name="description" content="Classify numbers as odd or even as fast as you can in 30 seconds. A free brain-speed challenge from GameFactoryLab.">
<link rel="canonical" href="https://gamefactorylab.github.io/gamefactorylab/games/parity-rush/">
<meta property="og:title" content="Parity Rush — Odd or Even Speed Challenge">
<meta property="og:description" content="Odd or even? Decide fast, protect the clock, and challenge a friend.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://gamefactorylab.github.io/gamefactorylab/games/parity-rush/">
<meta name="twitter:card" content="summary">
<link rel="stylesheet" href="../../core.css">
<style>
h1{margin:0;font-size:clamp(32px,9vw,52px);line-height:1}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{text-align:center;padding:10px}.stat span{font-size:11px;text-transform:uppercase}.stat b{display:block;font-size:22px}.number-card{text-align:center;padding:18px 12px}.number{display:block;font-size:clamp(72px,24vw,116px);font-weight:900;line-height:1}.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.choice{min-height:96px;font-size:24px;font-weight:900;border:0;border-radius:16px;background:#f8fafc;color:#111827;touch-action:manipulation}.choice:active{transform:scale(.99)}.status{text-align:center;min-height:28px;font-weight:800}.actions,.result-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.danger{background:rgba(254,202,202,.12);color:#fecaca;border:1px solid rgba(254,202,202,.25)}.sharebox,.result{display:none}.sharebox.show,.result.show{display:block}.result{text-align:center;border:1px solid rgba(52,211,153,.28);background:rgba(16,185,129,.08)}.result .eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:#86efac}.result strong{display:block;font-size:28px;margin:4px 0 10px}.result-actions .primary{grid-column:1/-1}.sharebox textarea{width:100%;min-height:88px;border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px;background:#0b1220;color:#f8fafc;font:inherit;resize:none}
</style>
</head>
<body>
<main class="app">
<a href="../../index.html" class="muted">← GameFactoryLab</a>
<section><h1>Parity Rush</h1><p class="muted">Odd or even? Answer fast for 30 seconds. Wrong answers cost 2 seconds.</p></section>
<section class="stats"><div class="card stat"><span class="muted">Score</span><b id="score">0</b></div><div class="card stat"><span class="muted">Time</span><b id="time">30</b></div><div class="card stat"><span class="muted">Best</span><b id="best">0</b></div></section>
<section class="card number-card"><span class="muted">Classify this number</span><strong id="number" class="number">42</strong></section>
<section class="choices"><button id="odd" type="button" class="choice">ODD</button><button id="even" type="button" class="choice">EVEN</button></section>
<div id="status" class="status muted">Tap Start</div>
<section id="result" class="card result" aria-live="polite"><div class="eyebrow">Run complete</div><strong id="resultSummary">Score 0</strong><div class="result-actions"><button id="playAgain" type="button" class="btn primary">Play again</button><button id="resultShare" type="button" class="btn secondary">Share result</button><button id="resultText" type="button" class="btn secondary">Show share text</button></div></section>
<div class="actions"><button id="start" type="button" class="btn primary">Start</button><button id="end" type="button" class="btn danger" disabled>End game</button><button id="share" type="button" class="btn secondary" disabled>Share score</button><button id="showText" type="button" class="btn secondary" disabled>Show share text</button></div>
<section id="shareBox" class="card sharebox"><label for="shareText" class="muted">Long-press to copy and share:</label><textarea id="shareText" readonly></textarea></section>
</main>
<script src="../../core.js"></script>
<script>
(()=>{
const G='parity-rush';
const el={number:document.getElementById('number'),odd:document.getElementById('odd'),even:document.getElementById('even'),score:document.getElementById('score'),time:document.getElementById('time'),best:document.getElementById('best'),status:document.getElementById('status'),start:document.getElementById('start'),end:document.getElementById('end'),share:document.getElementById('share'),showText:document.getElementById('showText'),shareBox:document.getElementById('shareBox'),shareText:document.getElementById('shareText'),result:document.getElementById('result'),resultSummary:document.getElementById('resultSummary'),playAgain:document.getElementById('playAgain'),resultShare:document.getElementById('resultShare'),resultText:document.getElementById('resultText')};
let score=0,time=30,current=42,running=false,locked=true,timer=null,lastNumber=null;
GameFactory.open(G);el.best.textContent=GameFactory.stats(G).best||0;
function next(){if(!running)return;let max=score<8?49:score<18?99:199;do{current=1+Math.floor(Math.random()*max)}while(current===lastNumber);lastNumber=current;el.number.textContent=current;el.status.textContent='Odd or even?';locked=false}
function pick(kind){if(!running||locked)return;locked=true;const correct=current%2===0?'even':'odd';if(kind===correct){score++;el.score.textContent=score;el.status.textContent='Correct!';GameFactory.event(G,'correct')}else{time=Math.max(0,time-2);el.time.textContent=time;el.status.textContent='Wrong · -2 sec';GameFactory.event(G,'wrong');if(time===0){finish('Time!');return}}setTimeout(next,120)}
function begin(){clearInterval(timer);score=0;time=30;running=true;locked=true;el.score.textContent='0';el.time.textContent='30';el.status.textContent='Go!';el.start.textContent='Restart';el.end.disabled=false;el.share.disabled=true;el.showText.disabled=true;el.shareBox.classList.remove('show');el.result.classList.remove('show');GameFactory.event(G,'start');next();timer=setInterval(()=>{if(!running)return;time--;el.time.textContent=time;if(time<=0)finish('Time!')},1000)}
function finish(prefix){if(!running)return;running=false;locked=true;clearInterval(timer);const s=GameFactory.score(G,score),best=s.best||score;el.best.textContent=best;el.status.textContent=`${prefix} Score: ${score}. Best: ${best}.`;el.resultSummary.textContent=`Score ${score} · Best ${best}`;el.result.classList.add('show');el.start.textContent='Play again';el.end.disabled=true;el.share.disabled=false;el.showText.disabled=false;GameFactory.event(G,'finish');GameFactory.event(G,'result_view');setTimeout(()=>el.result.scrollIntoView({behavior:'smooth',block:'center'}),80)}
function text(){return `I scored ${score} in 30 seconds in Parity Rush. Can you beat me?`}
function show(){el.shareText.value=text()+' '+GameFactory.challengeUrl(G,score);el.shareBox.classList.add('show');el.shareText.focus();el.shareText.select()}
async function doShare(source){if(source==='result')GameFactory.event(G,'result_share_click');const r=await GameFactory.share(G,'Parity Rush',text());if(r==='copied')el.status.textContent='Challenge link copied!';else if(r==='shared')el.status.textContent='Shared!';else if(r==='manual')show()}
el.odd.onclick=()=>pick('odd');el.even.onclick=()=>pick('even');el.start.onclick=begin;el.playAgain.onclick=()=>{GameFactory.event(G,'replay_click');begin()};el.end.onclick=()=>{GameFactory.event(G,'manual_end');finish('Game ended.')};el.share.onclick=()=>doShare('toolbar');el.resultShare.onclick=()=>doShare('result');el.showText.onclick=show;el.resultText.onclick=()=>{GameFactory.event(G,'result_share_click');show()};
})();
</script>
</body>
</html>
