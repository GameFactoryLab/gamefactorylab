name: Build free distribution wave 2

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'release-candidates/gravity-flip/**'
      - 'release-candidates/bridge-snap/**'
      - 'release-candidates/cluster-collapse/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave2.json'
      - '.github/workflows/build-free-wave2.yml'
  push:
    branches: [main]
    paths:
      - 'release-candidates/gravity-flip/**'
      - 'release-candidates/bridge-snap/**'
      - 'release-candidates/cluster-collapse/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave2.json'
      - '.github/workflows/build-free-wave2.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-cash runtime policy
        run: python3 scripts/zero_cash_guard.py

      - name: Build reusable distribution packages
        run: python3 scripts/build_distribution.py

      - name: Assemble priority wave
        run: |
          mkdir -p wave2/itch wave2/crazygames-basic wave2/metadata
          cp dist/GameFactoryLab_gravity_flip_itch.zip wave2/itch/
          cp dist/GameFactoryLab_bridge_snap_itch.zip wave2/itch/
          cp dist/GameFactoryLab_cluster_collapse_itch.zip wave2/itch/
          cp dist/crazygames-basic/GameFactoryLab_gravity_flip_crazygames_basic.zip wave2/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_bridge_snap_crazygames_basic.zip wave2/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_cluster_collapse_crazygames_basic.zip wave2/crazygames-basic/
          cp distribution/itch/wave2.json wave2/metadata/

      - name: Validate upload-ready ZIP roots
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          meta=json.loads(Path('wave2/metadata/wave2.json').read_text())
          packages=list(Path('wave2').glob('*/*.zip'))
          assert len(meta['games'])==3, meta
          assert len(packages)==6, packages
          expected={g['itch_package'] for g in meta['games']} | {g['crazygames_basic_package'] for g in meta['games']}
          assert {p.name for p in packages}==expected, ({p.name for p in packages}, expected)
          for p in packages:
              with zipfile.ZipFile(p) as z:
                  names=set(z.namelist())
                  assert 'index.html' in names, p
                  assert 'core.css' in names, p
                  assert 'core.js' in names, p
          print('Validated 6 Wave 2 upload packages')
          PY

      - name: Upload compact handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-free-wave2
          path: wave2/
          retention-days: 7
          if-no-files-found: error
