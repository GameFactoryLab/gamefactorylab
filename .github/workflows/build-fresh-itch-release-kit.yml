name: Build fresh itch.io release kit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'release-candidates/lock-line/**'
      - 'release-candidates/catch-drop/**'
      - 'release-candidates/pattern-relay/**'
      - 'scripts/build_release_candidates.py'
      - 'scripts/build_fresh_portal_assets.py'
      - 'scripts/build_fresh_itch_release_kit.py'
      - '.github/workflows/build-fresh-itch-release-kit.yml'
  push:
    branches: [main]
    paths:
      - 'release-candidates/lock-line/**'
      - 'release-candidates/catch-drop/**'
      - 'release-candidates/pattern-relay/**'
      - 'scripts/build_release_candidates.py'
      - 'scripts/build_fresh_portal_assets.py'
      - 'scripts/build_fresh_itch_release_kit.py'
      - '.github/workflows/build-fresh-itch-release-kit.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Enforce zero-cash guard
        run: python scripts/zero_cash_guard.py

      - name: Build candidate game ZIPs
        run: python scripts/build_release_candidates.py

      - name: Build itch.io release kit
        run: python scripts/build_fresh_itch_release_kit.py

      - name: Validate release kit
        shell: bash
        run: |
          set -euo pipefail
          root='handoff/fresh-itch-release-kit'
          test -s "$root/manifest.csv"
          test -s "$root/README.md"
          for game in lock-line catch-drop pattern-relay; do
            test -s "$root/$game/game.zip"
            test -s "$root/$game/cover.png"
            test -s "$root/$game/listing.txt"
            for i in 01 02 03 04; do
              test -s "$root/$game/screenshot-$i.png"
            done
          done
          python - <<'PY'
          import csv
          from pathlib import Path
          from PIL import Image

          root = Path('handoff/fresh-itch-release-kit')
          rows = list(csv.DictReader((root / 'manifest.csv').open(encoding='utf-8')))
          assert [r['slug'] for r in rows] == ['lock-line', 'catch-drop', 'pattern-relay'], rows
          assert all(r['status'] == 'READY' for r in rows)
          assert all(r['cash_spend_eur'] == '0' for r in rows)
          for slug in ('lock-line', 'catch-drop', 'pattern-relay'):
              assert Image.open(root / slug / 'cover.png').size == (630, 500)
              for i in range(1, 5):
                  assert Image.open(root / slug / f'screenshot-{i:02d}.png').size == (1280, 720)
          print('Validated itch.io kit: 3 games / 3 covers / 12 screenshots / 3 HTML5 ZIPs')
          PY

      - name: Upload zero-cash itch.io release kit
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-fresh-itch-release-kit
          path: handoff/fresh-itch-release-kit
          retention-days: 14
          if-no-files-found: error
