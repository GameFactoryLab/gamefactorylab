name: Build fresh portal assets

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'release-candidates/lock-line/**'
      - 'release-candidates/catch-drop/**'
      - 'release-candidates/pattern-relay/**'
      - 'release-candidates/mirror-mark/**'
      - 'release-candidates/track-three/**'
      - 'release-candidates/midpoint-rush/**'
      - 'release-candidates/tunnel-trace/**'
      - 'release-candidates/hidden-tally/**'
      - 'scripts/build_fresh_portal_assets.py'
      - 'scripts/build_track_three_portal_assets.py'
      - 'scripts/build_midpoint_rush_portal_assets.py'
      - 'scripts/build_tunnel_trace_portal_assets.py'
      - 'scripts/build_hidden_tally_handoff.py'
      - '.github/workflows/build-fresh-portal-assets.yml'
  push:
    branches: [main]
    paths:
      - 'release-candidates/lock-line/**'
      - 'release-candidates/catch-drop/**'
      - 'release-candidates/pattern-relay/**'
      - 'release-candidates/mirror-mark/**'
      - 'release-candidates/track-three/**'
      - 'release-candidates/midpoint-rush/**'
      - 'release-candidates/tunnel-trace/**'
      - 'release-candidates/hidden-tally/**'
      - 'scripts/build_fresh_portal_assets.py'
      - 'scripts/build_track_three_portal_assets.py'
      - 'scripts/build_midpoint_rush_portal_assets.py'
      - 'scripts/build_tunnel_trace_portal_assets.py'
      - 'scripts/build_hidden_tally_handoff.py'
      - '.github/workflows/build-fresh-portal-assets.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install free image tooling
        run: python -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Install free video tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffmpeg -version | head -n 1

      - name: Enforce zero-cash guard
        run: python scripts/zero_cash_guard.py

      - name: Build fresh-candidate portal assets
        run: python scripts/build_fresh_portal_assets.py

      - name: Extend portal assets with Track Three
        run: python scripts/build_track_three_portal_assets.py

      - name: Extend portal assets with Midpoint Rush
        run: python scripts/build_midpoint_rush_portal_assets.py

      - name: Extend portal assets with Tunnel Trace
        run: python scripts/build_tunnel_trace_portal_assets.py

      - name: Extend portal assets with Hidden Tally
        run: python scripts/build_hidden_tally_handoff.py portal

      - name: Validate required output set
        shell: bash
        run: |
          set -euo pipefail
          root='handoff/fresh-portal-assets'
          for game in lock-line catch-drop pattern-relay mirror-mark track-three midpoint-rush tunnel-trace hidden-tally; do
            for file in \
              cover-landscape.png \
              cover-portrait.png \
              cover-square.png \
              preview-landscape.mp4 \
              preview-portrait.mp4; do
              test -s "$root/$game/$file"
            done
          done
          test -s "$root/asset-manifest.csv"
          test -s "$root/README.md"
          python - <<'PY'
          import csv
          from pathlib import Path
          root = Path('handoff/fresh-portal-assets')
          rows = list(csv.DictReader((root / 'asset-manifest.csv').open(encoding='utf-8')))
          expected = ['lock-line', 'catch-drop', 'pattern-relay', 'mirror-mark', 'track-three', 'midpoint-rush', 'tunnel-trace', 'hidden-tally']
          assert [r['slug'] for r in rows] == expected, rows
          assert all(r['cash_spend_eur'] == '0' for r in rows)
          print('Validated portal asset kit: 8 games / 24 covers / 16 silent preview videos')
          PY

      - name: Upload zero-cash portal asset kit
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-fresh-portal-assets
          path: handoff/fresh-portal-assets
          if-no-files-found: error
          retention-days: 14
