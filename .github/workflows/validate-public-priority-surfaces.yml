name: Validate public priority surfaces

on:
  pull_request:
    paths:
      - 'index.html'
      - 'top5/**'
      - 'daily/**'
      - 'challenge/**'
      - 'sw.js'
      - 'scripts/validate_public_priority_surfaces.py'
      - '.github/workflows/validate-public-priority-surfaces.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'top5/**'
      - 'daily/**'
      - 'challenge/**'
      - 'sw.js'
      - 'scripts/validate_public_priority_surfaces.py'
      - '.github/workflows/validate-public-priority-surfaces.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate commercial-priority public surfaces
        run: python3 scripts/validate_public_priority_surfaces.py
