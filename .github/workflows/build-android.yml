name: Build Android Quick Games APK

on:
  pull_request:
    paths:
      - 'games/**'
      - 'core.js'
      - 'core.css'
      - 'index.html'
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  push:
    branches: [main]
    paths:
      - 'games/**'
      - 'core.js'
      - 'core.css'
      - 'index.html'
      - 'mobile/android/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify preinstalled Android 16 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-36"
          test -d "$ANDROID_HOME/build-tools/36.0.0"
          "$ANDROID_HOME/platform-tools/adb" version || true

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Bundle owned HTML5 portfolio into app
        run: |
          rm -rf mobile/android/app/src/main/assets/www
          mkdir -p mobile/android/app/src/main/assets/www
          cp index.html core.css core.js icon.svg manifest.webmanifest mobile/android/app/src/main/assets/www/
          cp -R games mobile/android/app/src/main/assets/www/games
          test -f mobile/android/app/src/main/assets/www/games/odd-one-out/index.html
          game_count=$(find mobile/android/app/src/main/assets/www/games -mindepth 1 -maxdepth 1 -type d | wc -l)
          test "$game_count" -ge 15
          echo "Bundled $game_count games into Android assets"

      - name: Build debug APK
        run: gradle -p mobile/android :app:assembleDebug --stacktrace

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: gamefactorylab-quick-games-android-debug
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
