name: Build free distribution wave 7

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'games/lane-dodge/**'
      - 'games/stack-drop/**'
      - 'games/tile-shift/**'
      - 'games/grid-toggle/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave7.json'
      - '.github/workflows/build-free-wave7.yml'
  push:
    branches: [main]
    paths:
      - 'games/lane-dodge/**'
      - 'games/stack-drop/**'
      - 'games/tile-shift/**'
      - 'games/grid-toggle/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave7.json'
      - '.github/workflows/build-free-wave7.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-cash runtime policy
        run: python3 scripts/zero_cash_guard.py

      - name: Build reusable distribution packages
        run: python3 scripts/build_distribution.py

      - name: Assemble mobile-QA-cleared browser wave
        run: |
          mkdir -p wave7/itch wave7/crazygames-basic wave7/metadata
          cp dist/GameFactoryLab_lane_dodge_itch.zip wave7/itch/
          cp dist/GameFactoryLab_stack_drop_itch.zip wave7/itch/
          cp dist/GameFactoryLab_tile_shift_itch.zip wave7/itch/
          cp dist/GameFactoryLab_grid_toggle_itch.zip wave7/itch/
          cp dist/crazygames-basic/GameFactoryLab_lane_dodge_crazygames_basic.zip wave7/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_stack_drop_crazygames_basic.zip wave7/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_tile_shift_crazygames_basic.zip wave7/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_grid_toggle_crazygames_basic.zip wave7/crazygames-basic/
          cp distribution/itch/wave7.json wave7/metadata/

      - name: Validate upload-ready ZIP roots
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          meta=json.loads(Path('wave7/metadata/wave7.json').read_text())
          packages=list(Path('wave7').glob('*/*.zip'))
          assert meta['cash_spend_eur']==0, meta
          assert len(meta['games'])==4, meta
          assert len(packages)==8, packages
          expected={g['itch_package'] for g in meta['games']} | {g['crazygames_basic_package'] for g in meta['games']}
          assert {p.name for p in packages}==expected, ({p.name for p in packages}, expected)
          for p in packages:
              with zipfile.ZipFile(p) as z:
                  names=set(z.namelist())
                  assert 'index.html' in names, p
                  assert 'core.css' in names, p
                  assert 'core.js' in names, p
          print('Validated 8 Wave 7 upload packages')
          PY

      - name: Upload compact handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-free-wave7
          path: wave7/
          retention-days: 7
          if-no-files-found: error
