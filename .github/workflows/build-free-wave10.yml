name: Build free distribution wave 10

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'games/color-stack-sort/**'
      - 'games/maze-dash/**'
      - 'games/one-back/**'
      - 'games/word-scramble-rush/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave10.json'
      - '.github/workflows/build-free-wave10.yml'
  push:
    branches: [main]
    paths:
      - 'games/color-stack-sort/**'
      - 'games/maze-dash/**'
      - 'games/one-back/**'
      - 'games/word-scramble-rush/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave10.json'
      - '.github/workflows/build-free-wave10.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-cash runtime policy
        run: python3 scripts/zero_cash_guard.py

      - name: Build reusable distribution packages
        run: python3 scripts/build_distribution.py

      - name: Assemble mixed-mechanic browser wave
        run: |
          mkdir -p wave10/itch wave10/crazygames-basic wave10/metadata
          cp dist/GameFactoryLab_color_stack_sort_itch.zip wave10/itch/
          cp dist/GameFactoryLab_maze_dash_itch.zip wave10/itch/
          cp dist/GameFactoryLab_one_back_itch.zip wave10/itch/
          cp dist/GameFactoryLab_word_scramble_rush_itch.zip wave10/itch/
          cp dist/crazygames-basic/GameFactoryLab_color_stack_sort_crazygames_basic.zip wave10/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_maze_dash_crazygames_basic.zip wave10/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_one_back_crazygames_basic.zip wave10/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_word_scramble_rush_crazygames_basic.zip wave10/crazygames-basic/
          cp distribution/itch/wave10.json wave10/metadata/

      - name: Validate upload-ready ZIP roots
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          meta=json.loads(Path('wave10/metadata/wave10.json').read_text())
          packages=list(Path('wave10').glob('*/*.zip'))
          assert meta['cash_spend_eur']==0, meta
          assert meta['distribution_status']=='upload-ready', meta
          assert len(meta['games'])==4, meta
          assert len(packages)==8, packages
          expected={g['itch_package'] for g in meta['games']} | {g['crazygames_basic_package'] for g in meta['games']}
          assert {p.name for p in packages}==expected, ({p.name for p in packages}, expected)
          for p in packages:
              with zipfile.ZipFile(p) as z:
                  names=set(z.namelist())
                  assert 'index.html' in names, p
                  assert 'core.css' in names, p
                  assert 'core.js' in names, p
          print('Validated 8 Wave 10 upload packages')
          PY

      - name: Upload compact handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-free-wave10
          path: wave10/
          retention-days: 7
          if-no-files-found: error
