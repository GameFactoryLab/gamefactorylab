name: Build Android Mobile Games

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - 'games/**'
      - 'sprint/**'
      - 'labs/**'
      - 'release-candidates/**'
      - 'index.html'
      - 'core.css'
      - 'core.js'
      - '.github/workflows/android-mobile.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - 'games/**'
      - 'sprint/**'
      - 'labs/**'
      - 'release-candidates/**'
      - 'index.html'
      - 'core.css'
      - 'core.js'
      - '.github/workflows/android-mobile.yml'

jobs:
  portfolio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Package portfolio
        run: python3 mobile/android/prepare_assets.py
      - name: Build portfolio APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify portfolio APK
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/games/ring-pins/index.html'
      - uses: actions/upload-artifact@v4
        with:
          name: gamefactory-quick-games-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

  individual-games:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: color-stack-sort
            source: games
            title: Color Stack Sort
            app_id: com.gamefactorylab.colorstacksort
          - slug: ring-pins
            source: games
            title: Ring Pins
            app_id: com.gamefactorylab.ringpins
          - slug: circuit-flow
            source: release-candidates
            title: Circuit Flow
            app_id: com.gamefactorylab.circuitflow
          - slug: route-once
            source: release-candidates
            title: Route Once
            app_id: com.gamefactorylab.routeonce
          - slug: pixel-logic
            source: release-candidates
            title: Pixel Logic
            app_id: com.gamefactorylab.pixellogic
          - slug: orbit-align
            source: release-candidates
            title: Orbit Align
            app_id: com.gamefactorylab.orbitalign
          - slug: sum-vault
            source: release-candidates
            title: Sum Vault
            app_id: com.gamefactorylab.sumvault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Package one game
        run: python3 mobile/android/prepare_assets.py --game-slug "${{ matrix.slug }}" --game-source "${{ matrix.source }}"
      - name: Build standalone APK
        working-directory: mobile/android
        run: >
          gradle --no-daemon :app:assembleDebug
          -PgameSlug="${{ matrix.slug }}"
          -PgameSource="${{ matrix.source }}"
          -PgameTitle="${{ matrix.title }}"
          -PgameAppId="${{ matrix.app_id }}"
      - name: Verify standalone APK
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/www/${{ matrix.source }}/${{ matrix.slug }}/index.html"
      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "GameFactoryLab_${{ matrix.slug }}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: gamefactory-${{ matrix.slug }}-android
          path: GameFactoryLab_${{ matrix.slug }}_android.apk
          retention-days: 7
