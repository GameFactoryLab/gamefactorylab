name: Build Android Mobile Games

on:
  workflow_dispatch:
    inputs:
      build_all:
        description: Build all 32 catalog targets instead of the priority set
        required: false
        default: false
        type: boolean
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - 'games/**'
      - 'sprint/**'
      - 'labs/**'
      - 'release-candidates/**'
      - 'index.html'
      - 'core.css'
      - 'core.js'
      - '.github/workflows/android-mobile.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - 'games/**'
      - 'sprint/**'
      - 'labs/**'
      - 'release-candidates/**'
      - 'index.html'
      - 'core.css'
      - 'core.js'
      - '.github/workflows/android-mobile.yml'

jobs:
  catalog:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate mobile catalog
        run: python3 mobile/android/validate_catalog.py
      - name: Select standalone build matrix
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          BUILD_ALL: ${{ inputs.build_all || false }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          data=json.loads(Path('mobile/android/game_catalog.json').read_text())
          build_all=os.environ.get('EVENT_NAME')=='workflow_dispatch' and os.environ.get('BUILD_ALL','false').lower()=='true'
          games=data['games'] if build_all else [g for g in data['games'] if g.get('auto_build')]
          print('matrix='+json.dumps({'include':games},separators=(',',':')))
          print(f'Selected {len(games)} standalone Android targets', file=__import__('sys').stderr)
          PY

  portfolio:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Package portfolio
        run: python3 mobile/android/prepare_assets.py
      - name: Build portfolio APK
        working-directory: mobile/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify portfolio APK
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -q 'assets/www/games/ring-pins/index.html'
      - uses: actions/upload-artifact@v4
        with:
          name: gamefactory-quick-games-android
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1

  individual-games:
    needs: catalog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.catalog.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Package one game
        run: python3 mobile/android/prepare_assets.py --game-slug "${{ matrix.slug }}" --game-source "${{ matrix.source }}"
      - name: Build standalone APK
        working-directory: mobile/android
        run: >
          gradle --no-daemon :app:assembleDebug
          -PgameSlug="${{ matrix.slug }}"
          -PgameSource="${{ matrix.source }}"
          -PgameTitle="${{ matrix.title }}"
          -PgameAppId="${{ matrix.app_id }}"
      - name: Verify standalone APK
        run: |
          test -s mobile/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l mobile/android/app/build/outputs/apk/debug/app-debug.apk | grep -q "assets/www/${{ matrix.source }}/${{ matrix.slug }}/index.html"
      - name: Rename APK
        run: cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "GameFactoryLab_${{ matrix.slug }}_android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: gamefactory-${{ matrix.slug }}-android
          path: GameFactoryLab_${{ matrix.slug }}_android.apk
          retention-days: 1
