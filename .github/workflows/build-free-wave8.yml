name: Build free distribution wave 8

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'games/odd-one-out/**'
      - 'games/reaction-rush/**'
      - 'games/sequence-snap/**'
      - 'games/perfect-tap/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave8.json'
      - '.github/workflows/build-free-wave8.yml'
  push:
    branches: [main]
    paths:
      - 'games/odd-one-out/**'
      - 'games/reaction-rush/**'
      - 'games/sequence-snap/**'
      - 'games/perfect-tap/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave8.json'
      - '.github/workflows/build-free-wave8.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-cash runtime policy
        run: python3 scripts/zero_cash_guard.py

      - name: Build reusable distribution packages
        run: python3 scripts/build_distribution.py

      - name: Assemble fast-loop browser wave
        run: |
          mkdir -p wave8/itch wave8/crazygames-basic wave8/metadata
          cp dist/GameFactoryLab_odd_one_out_itch.zip wave8/itch/
          cp dist/GameFactoryLab_reaction_rush_itch.zip wave8/itch/
          cp dist/GameFactoryLab_sequence_snap_itch.zip wave8/itch/
          cp dist/GameFactoryLab_perfect_tap_itch.zip wave8/itch/
          cp dist/crazygames-basic/GameFactoryLab_odd_one_out_crazygames_basic.zip wave8/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_reaction_rush_crazygames_basic.zip wave8/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_sequence_snap_crazygames_basic.zip wave8/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_perfect_tap_crazygames_basic.zip wave8/crazygames-basic/
          cp distribution/itch/wave8.json wave8/metadata/

      - name: Validate upload-ready ZIP roots
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          meta=json.loads(Path('wave8/metadata/wave8.json').read_text())
          packages=list(Path('wave8').glob('*/*.zip'))
          assert meta['cash_spend_eur']==0, meta
          assert len(meta['games'])==4, meta
          assert len(packages)==8, packages
          expected={g['itch_package'] for g in meta['games']} | {g['crazygames_basic_package'] for g in meta['games']}
          assert {p.name for p in packages}==expected, ({p.name for p in packages}, expected)
          for p in packages:
              with zipfile.ZipFile(p) as z:
                  names=set(z.namelist())
                  assert 'index.html' in names, p
                  assert 'core.css' in names, p
                  assert 'core.js' in names, p
          print('Validated 8 Wave 8 upload packages')
          PY

      - name: Upload compact handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-free-wave8
          path: wave8/
          retention-days: 7
          if-no-files-found: error
