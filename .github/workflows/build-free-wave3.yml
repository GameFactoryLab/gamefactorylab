name: Build free distribution wave 3

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'release-candidates/pulse-cascade/**'
      - 'release-candidates/balance-drop/**'
      - 'release-candidates/cipher-sprint/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave3.json'
      - '.github/workflows/build-free-wave3.yml'
  push:
    branches: [main]
    paths:
      - 'release-candidates/pulse-cascade/**'
      - 'release-candidates/balance-drop/**'
      - 'release-candidates/cipher-sprint/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave3.json'
      - '.github/workflows/build-free-wave3.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-cash runtime policy
        run: python3 scripts/zero_cash_guard.py

      - name: Build reusable distribution packages
        run: python3 scripts/build_distribution.py

      - name: Assemble priority wave
        run: |
          mkdir -p wave3/itch wave3/crazygames-basic wave3/metadata
          cp dist/GameFactoryLab_pulse_cascade_itch.zip wave3/itch/
          cp dist/GameFactoryLab_balance_drop_itch.zip wave3/itch/
          cp dist/GameFactoryLab_cipher_sprint_itch.zip wave3/itch/
          cp dist/crazygames-basic/GameFactoryLab_pulse_cascade_crazygames_basic.zip wave3/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_balance_drop_crazygames_basic.zip wave3/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_cipher_sprint_crazygames_basic.zip wave3/crazygames-basic/
          cp distribution/itch/wave3.json wave3/metadata/

      - name: Validate upload-ready ZIP roots
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          meta=json.loads(Path('wave3/metadata/wave3.json').read_text())
          packages=list(Path('wave3').glob('*/*.zip'))
          assert meta['cash_spend_eur']==0, meta
          assert len(meta['games'])==3, meta
          assert len(packages)==6, packages
          expected={g['itch_package'] for g in meta['games']} | {g['crazygames_basic_package'] for g in meta['games']}
          assert {p.name for p in packages}==expected, ({p.name for p in packages}, expected)
          for p in packages:
              with zipfile.ZipFile(p) as z:
                  names=set(z.namelist())
                  assert 'index.html' in names, p
                  assert 'core.css' in names, p
                  assert 'core.js' in names, p
          print('Validated 6 Wave 3 upload packages')
          PY

      - name: Upload compact handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-free-wave3
          path: wave3/
          retention-days: 7
          if-no-files-found: error
