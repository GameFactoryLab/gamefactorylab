name: Build free distribution wave 9

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'games/flash-count/**'
      - 'games/quick-sum/**'
      - 'games/memory-path/**'
      - 'games/higher-lower/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave9.json'
      - '.github/workflows/build-free-wave9.yml'
  push:
    branches: [main]
    paths:
      - 'games/flash-count/**'
      - 'games/quick-sum/**'
      - 'games/memory-path/**'
      - 'games/higher-lower/**'
      - 'core.js'
      - 'core.css'
      - 'scripts/build_distribution.py'
      - 'scripts/zero_cash_guard.py'
      - 'distribution/itch/wave9.json'
      - '.github/workflows/build-free-wave9.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Enforce zero-cash runtime policy
        run: python3 scripts/zero_cash_guard.py

      - name: Build reusable distribution packages
        run: python3 scripts/build_distribution.py

      - name: Assemble cognition browser wave
        run: |
          mkdir -p wave9/itch wave9/crazygames-basic wave9/metadata
          cp dist/GameFactoryLab_flash_count_itch.zip wave9/itch/
          cp dist/GameFactoryLab_quick_sum_itch.zip wave9/itch/
          cp dist/GameFactoryLab_memory_path_itch.zip wave9/itch/
          cp dist/GameFactoryLab_higher_lower_itch.zip wave9/itch/
          cp dist/crazygames-basic/GameFactoryLab_flash_count_crazygames_basic.zip wave9/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_quick_sum_crazygames_basic.zip wave9/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_memory_path_crazygames_basic.zip wave9/crazygames-basic/
          cp dist/crazygames-basic/GameFactoryLab_higher_lower_crazygames_basic.zip wave9/crazygames-basic/
          cp distribution/itch/wave9.json wave9/metadata/

      - name: Validate upload-ready ZIP roots
        run: |
          python3 - <<'PY'
          import json, zipfile
          from pathlib import Path

          meta=json.loads(Path('wave9/metadata/wave9.json').read_text())
          packages=list(Path('wave9').glob('*/*.zip'))
          assert meta['cash_spend_eur']==0, meta
          assert len(meta['games'])==4, meta
          assert len(packages)==8, packages
          expected={g['itch_package'] for g in meta['games']} | {g['crazygames_basic_package'] for g in meta['games']}
          assert {p.name for p in packages}==expected, ({p.name for p in packages}, expected)
          for p in packages:
              with zipfile.ZipFile(p) as z:
                  names=set(z.namelist())
                  assert 'index.html' in names, p
                  assert 'core.css' in names, p
                  assert 'core.js' in names, p
          print('Validated 8 Wave 9 upload packages')
          PY

      - name: Upload compact handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-free-wave9
          path: wave9/
          retention-days: 7
          if-no-files-found: error
