name: Build Google Play Wave 2 AABs

on:
  workflow_dispatch:
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - 'games/mini-sudoku-rush/**'
      - 'games/dot-compare/**'
      - 'games/flood-grid/**'
      - '.github/workflows/google-play-wave2.yml'
      - 'mobile/play/**'
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - 'games/mini-sudoku-rush/**'
      - 'games/dot-compare/**'
      - 'games/flood-grid/**'
      - '.github/workflows/google-play-wave2.yml'
      - 'mobile/play/**'

jobs:
  aab:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: mini-sudoku-rush
            source: games
            title: Mini Sudoku Rush
            app_id: com.gamefactorylab.minisudokurush
          - slug: dot-compare
            source: games
            title: Dot Compare
            app_id: com.gamefactorylab.dotcompare
          - slug: flood-grid
            source: games
            title: Flood Grid
            app_id: com.gamefactorylab.floodgrid

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Verify Android 16 / API 36
        run: |
          test -d "$ANDROID_HOME/platforms/android-36"
          ls "$ANDROID_HOME/build-tools" | grep -q '^36'
      - name: Package selected game
        run: python3 mobile/android/prepare_assets.py --game-slug "${{ matrix.slug }}" --game-source "${{ matrix.source }}"
      - name: Build Play AAB
        working-directory: mobile/android
        run: >
          gradle --no-daemon :app:bundleRelease
          -PgameSlug="${{ matrix.slug }}"
          -PgameSource="${{ matrix.source }}"
          -PgameTitle="${{ matrix.title }}"
          -PgameAppId="${{ matrix.app_id }}"
      - name: Verify AAB
        run: |
          test -s mobile/android/app/build/outputs/bundle/release/app-release.aab
          unzip -l mobile/android/app/build/outputs/bundle/release/app-release.aab | grep -q 'base/assets/www/'
      - name: Rename AAB
        run: cp mobile/android/app/build/outputs/bundle/release/app-release.aab "GameFactoryLab_${{ matrix.slug }}_play-wave2.aab"
      - uses: actions/upload-artifact@v4
        with:
          name: play-wave2-${{ matrix.slug }}-aab
          path: GameFactoryLab_${{ matrix.slug }}_play-wave2.aab
          retention-days: 7
