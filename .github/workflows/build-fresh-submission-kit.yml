name: Build zero-cash fresh submission kit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'release-candidates/lock-line/**'
      - 'release-candidates/catch-drop/**'
      - 'release-candidates/pattern-relay/**'
      - 'release-candidates/mirror-mark/**'
      - 'release-candidates/track-three/**'
      - 'release-candidates/midpoint-rush/**'
      - 'release-candidates/tunnel-trace/**'
      - 'scripts/build_release_candidates.py'
      - 'scripts/build_fresh_submission_kit.py'
      - '.github/workflows/build-fresh-submission-kit.yml'
  push:
    branches: [main]
    paths:
      - 'release-candidates/lock-line/**'
      - 'release-candidates/catch-drop/**'
      - 'release-candidates/pattern-relay/**'
      - 'release-candidates/mirror-mark/**'
      - 'release-candidates/track-three/**'
      - 'release-candidates/midpoint-rush/**'
      - 'release-candidates/tunnel-trace/**'
      - 'scripts/build_release_candidates.py'
      - 'scripts/build_fresh_submission_kit.py'
      - '.github/workflows/build-fresh-submission-kit.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and validate release candidates
        run: python3 scripts/build_release_candidates.py

      - name: Assemble fresh-candidate handoff
        run: python3 scripts/build_fresh_submission_kit.py

      - name: Validate operator kit
        run: |
          python3 - <<'PY'
          import csv, re, zipfile
          from pathlib import Path

          runtime_re = re.compile(
              r"<(?:script|img|iframe|audio|video|source)\b[^>]*\bsrc\s*=\s*[\"']https?://"
              r"|<object\b[^>]*\bdata\s*=\s*[\"']https?://"
              r"|<link\b(?=[^>]*\brel\s*=\s*[\"'][^\"']*stylesheet[^\"']*[\"'])[^>]*\bhref\s*=\s*[\"']https?://"
              r"|url\(\s*[\"']?https?://",
              re.I,
          )
          blocked = ('__GAME_ID__', '__PLACEMENT_ID__', '__AD_UNIT__')
          verified_crazygames_tags = {
              '1 Player', '2D', 'Avoid', 'Brain', 'Casual', 'Collect',
              'Logic', 'Mobile', 'Mouse', 'One Button', 'Skill', 'Speed',
              'Train your brain',
          }
          root = Path('handoff/fresh-submission-kit')
          rows = list(csv.DictReader((root / 'submission-metadata.csv').open(encoding='utf-8')))
          expected = ['lock-line', 'catch-drop', 'pattern-relay', 'mirror-mark', 'track-three', 'midpoint-rush', 'tunnel-trace']
          assert [row['slug'] for row in rows] == expected, rows
          assert all(row['status'] == 'READY' for row in rows)
          assert all(row['cash_spend_eur'] == '0' for row in rows)
          assert all(row['itch_tags'].strip() for row in rows)
          assert all(row['crazygames_tag_reference_date'] == '2026-09-24' for row in rows)
          for row in rows:
              tags = {tag.strip() for tag in row['crazygames_tags'].split(',') if tag.strip()}
              assert tags, row
              assert tags <= verified_crazygames_tags, (row['slug'], tags - verified_crazygames_tags)

          packages = list((root / 'itch').glob('*.zip')) + list((root / 'crazygames-basic').glob('*.zip'))
          assert len(packages) == 14, packages
          for package in packages:
              with zipfile.ZipFile(package) as archive:
                  names = set(archive.namelist())
                  assert 'index.html' in names, package
                  html = archive.read('index.html').decode('utf-8')
                  assert not runtime_re.search(html), package
                  assert not any(marker in html for marker in blocked), package
          print('Validated fresh submission kit: 7 candidates / 14 portal handoff packages / portal-specific tag sets')
          PY

      - name: Upload operator handoff bundle
        uses: actions/upload-artifact@v4
        with:
          name: gamefactory-fresh-submission-kit
          path: handoff/fresh-submission-kit/
          retention-days: 7
          if-no-files-found: error
