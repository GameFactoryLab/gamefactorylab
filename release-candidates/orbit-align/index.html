<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0b1220"><title>Orbit Align</title><meta name="description" content="Rotate three orbital rings and align every marker with its target."><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:#050b14}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 20%,#172554,#050b14 58%);display:grid;place-items:center}.app{width:min(94vw,560px);padding:16px}.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#67e8f9}h1{font-size:44px;margin:4px 0}.muted{color:#94a3b8}.stats{display:flex;gap:8px}.stat,.card{background:#0f172a;border:1px solid #263247;border-radius:16px;padding:12px}.stat{flex:1;text-align:center}.stat b{display:block;font-size:22px}.arena{position:relative;aspect-ratio:1;max-width:420px;margin:14px auto}.ring{position:absolute;border:3px solid #334155;border-radius:50%;left:50%;top:50%;transform:translate(-50%,-50%)}.r1{width:92%;height:92%}.r2{width:68%;height:68%}.r3{width:44%;height:44%}.dot,.target{position:absolute;width:22px;height:22px;border-radius:50%;left:50%;top:50%;margin:-11px}.dot{background:#22d3ee;box-shadow:0 0 18px #22d3ee}.target{border:3px solid #f59e0b;background:#f59e0b22}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:#e2e8f0}.controls{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.btn{border:0;border-radius:12px;padding:13px 10px;font-weight:800;background:#0e7490;color:white}.btn.alt{background:#1e293b}.status{text-align:center;min-height:26px;font-weight:700;margin-top:8px}.overlay{position:fixed;inset:0;background:#020617e8;display:grid;place-items:center;padding:20px}.panel{width:min(92vw,440px);background:#0f172a;border:1px solid #334155;border-radius:20px;padding:20px}.hidden{display:none}.panel .btn{width:100%;margin-top:9px}.small{font-size:12px}</style></head><body><main class="app"><div class="brand">GameFactoryLab • release candidate</div><h1>Orbit Align</h1><p class="muted">Rotate all three rings until every cyan marker sits on its amber target.</p><div class="stats"><div class="stat"><span>Level</span><b id="level">1/20</b></div><div class="stat"><span>Moves</span><b id="moves">0</b></div><div class="stat"><span>Best</span><b id="best">0</b></div></div><section class="card"><div class="arena" id="arena"><div class="ring r1"></div><div class="ring r2"></div><div class="ring r3"></div><div class="center"></div></div><div class="controls"><button class="btn" data-ring="0">Outer ↻</button><button class="btn" data-ring="1">Middle ↻</button><button class="btn" data-ring="2">Inner ↻</button></div><div class="controls" style="margin-top:8px"><button id="check" class="btn">Check</button><button id="restart" class="btn alt">Restart</button><button id="hint" class="btn alt">Hint</button></div><div id="status" class="status muted">Align all three orbits.</div></section><p class="muted small">No paid assets • no external services • test signals save locally</p></main><section id="overlay" class="overlay hidden"><div class="panel"><div class="brand">Alignment complete</div><h2>Locked in.</h2><p id="detail"></p><button id="next" class="btn">Next level</button><button id="replay" class="btn alt">Replay</button><button id="share" class="btn alt">Share result</button></div></section><script>(()=>{'use strict';const KEY='gf_candidate_orbit_align_v1',TOTAL=20,arena=document.getElementById('arena'),lev=document.getElementById('level'),movesEl=document.getElementById('moves'),bestEl=document.getElementById('best'),status=document.getElementById('status'),ov=document.getElementById('overlay');let level=1,moves=0,pos=[0,0,0],target=[0,0,0],start=[0,0,0];const radii=[46,34,22];function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}function save(x){localStorage.setItem(KEY,JSON.stringify({...load(),...x}))}function sig(k){const s=load(),m={...(s.metrics||{})};m[k]=(m[k]||0)+1;save({metrics:m})}function setup(){moves=0;target=[(level*2+1)%8,(level*3+2)%8,(level*5+4)%8];start=target.map((t,i)=>(t+2+((level+i)%5))%8);pos=[...start];render()}function xy(step,r){const a=(step/8)*Math.PI*2-Math.PI/2;return[50+Math.cos(a)*r,50+Math.sin(a)*r]}function render(){arena.querySelectorAll('.dot,.target').forEach(x=>x.remove());for(let i=0;i<3;i++){const [tx,ty]=xy(target[i],radii[i]),[px,py]=xy(pos[i],radii[i]);const t=document.createElement('div');t.className='target';t.style.left=tx+'%';t.style.top=ty+'%';t.style.transform='translate(-50%,-50%)';arena.appendChild(t);const d=document.createElement('div');d.className='dot';d.style.left=px+'%';d.style.top=py+'%';d.style.transform='translate(-50%,-50%)';arena.appendChild(d)}lev.textContent=`${level}/${TOTAL}`;movesEl.textContent=moves;bestEl.textContent=load().bestLevel||0}function aligned(){return pos.every((v,i)=>v===target[i])}document.querySelectorAll('[data-ring]').forEach(b=>b.onclick=()=>{const i=+b.dataset.ring;pos[i]=(pos[i]+1)%8;moves++;sig('ring_rotate');render();status.textContent='Keep aligning the markers.'});document.getElementById('check').onclick=()=>{sig('check');if(aligned()){sig('level_clear');const s=load(),best=Math.max(s.bestLevel||0,level);save({bestLevel:best,unlocked:Math.max(s.unlocked||1,Math.min(TOTAL,level+1))});document.getElementById('detail').textContent=`Level ${level} aligned in ${moves} moves.`;ov.classList.remove('hidden')}else{status.textContent='Not aligned yet.';sig('wrong_check')}};document.getElementById('restart').onclick=()=>{sig('restart');pos=[...start];moves=0;render()};document.getElementById('hint').onclick=()=>{sig('hint');const i=pos.findIndex((v,j)=>v!==target[j]);if(i>=0){pos[i]=(pos[i]+1)%8;moves++;render()}status.textContent='One orbit moved closer.'};document.getElementById('replay').onclick=()=>{ov.classList.add('hidden');sig('replay_click');setup()};document.getElementById('next').onclick=()=>{ov.classList.add('hidden');level=level<TOTAL?level+1:1;sig('next_level');setup()};document.getElementById('share').onclick=async()=>{const text=`I aligned Orbit Align level ${level} in ${moves} moves.`;sig('result_share_click');try{if(navigator.share)await navigator.share({title:'Orbit Align',text});else await navigator.clipboard.writeText(text);status.textContent='Result ready to share.'}catch{status.textContent='Share cancelled.'}};const s=load();level=Math.min(TOTAL,Math.max(1,s.unlocked||1));setup()})();</script></body></html>
