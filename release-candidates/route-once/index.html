<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#101827"><title>Route Once</title><meta name="description" content="Visit every tile exactly once in a compact one-stroke logic puzzle."><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:#07101f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#0f172a,#07101f);display:grid;place-items:center}.app{width:min(94vw,560px);padding:16px}.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#93c5fd}h1{font-size:44px;margin:4px 0}.muted{color:#94a3b8}.row{display:flex;gap:8px;flex-wrap:wrap}.stat,.card{background:#111827;border:1px solid #263247;border-radius:16px;padding:12px}.stat{flex:1;text-align:center}.stat b{display:block;font-size:22px}.grid{display:grid;gap:7px;margin:14px 0}.cell{aspect-ratio:1;border:0;border-radius:12px;background:#1e293b;color:white;font-weight:900;font-size:18px}.cell.start{outline:2px solid #60a5fa}.cell.end{box-shadow:inset 0 0 0 2px #f59e0b}.cell.used{background:#2563eb}.cell.current{background:#10b981}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#2563eb;color:white;flex:1}.btn.alt{background:#1e293b}.status{text-align:center;min-height:26px;font-weight:700}.overlay{position:fixed;inset:0;background:#020617e8;display:grid;place-items:center;padding:20px}.panel{width:min(92vw,440px);background:#0f172a;border:1px solid #334155;border-radius:20px;padding:20px}.hidden{display:none}.panel .btn{width:100%;margin-top:9px}.small{font-size:12px}</style></head><body><main class="app"><div class="brand">GameFactoryLab • release candidate</div><h1>Route Once</h1><p class="muted">Visit every tile exactly once. Finish on the gold tile.</p><div class="row"><div class="stat"><span>Level</span><b id="level">1/16</b></div><div class="stat"><span>Moves</span><b id="moves">0</b></div><div class="stat"><span>Best</span><b id="best">0</b></div></div><section class="card"><div id="grid" class="grid"></div><div id="status" class="status muted">Tap the blue start tile.</div><div class="row"><button id="undo" class="btn alt">Undo</button><button id="restart" class="btn alt">Restart</button></div></section><p class="muted small">No paid assets • no external services • test signals save locally</p></main><section id="overlay" class="overlay hidden"><div class="panel"><div class="brand">Route complete</div><h2 id="result">Clean route!</h2><p id="detail"></p><button id="next" class="btn">Next level</button><button id="replay" class="btn alt">Replay</button><button id="share" class="btn alt">Share result</button></div></section><script>(()=>{'use strict';const TOTAL=16,KEY='gf_candidate_route_once_v1',g=document.getElementById('grid'),lev=document.getElementById('level'),movesEl=document.getElementById('moves'),bestEl=document.getElementById('best'),status=document.getElementById('status'),ov=document.getElementById('overlay');let level=1,n=4,path=[];function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}function save(x){localStorage.setItem(KEY,JSON.stringify({...load(),...x}))}function sig(k){const s=load(),m={...(s.metrics||{})};m[k]=(m[k]||0)+1;save({metrics:m})}function size(l){return l<6?4:l<12?5:6}function startIndex(){return level%2?0:n-1}function endIndex(){return level%2?n*n-1:n*(n-1)}function adj(a,b){const ar=Math.floor(a/n),ac=a%n,br=Math.floor(b/n),bc=b%n;return Math.abs(ar-br)+Math.abs(ac-bc)===1}function render(){n=size(level);g.style.gridTemplateColumns=`repeat(${n},1fr)`;g.innerHTML='';for(let i=0;i<n*n;i++){const b=document.createElement('button');b.className='cell';if(i===startIndex())b.classList.add('start');if(i===endIndex())b.classList.add('end');const pos=path.indexOf(i);if(pos>=0)b.classList.add('used');if(pos===path.length-1)b.classList.add('current');b.textContent=pos>=0?pos+1:'';b.onclick=()=>tap(i);g.appendChild(b)}lev.textContent=`${level}/${TOTAL}`;movesEl.textContent=Math.max(0,path.length-1);bestEl.textContent=load().bestLevel||0}function tap(i){if(path.length===0){if(i!==startIndex()){status.textContent='Start on the blue tile.';sig('invalid_start');return}path=[i];sig('run_start');render();return}if(path.includes(i)){status.textContent='Each tile can be used only once.';sig('repeat_block');return}if(!adj(path[path.length-1],i)){status.textContent='Move only to a neighboring tile.';sig('non_adjacent');return}path.push(i);sig('move');render();if(path.length===n*n){if(i===endIndex())win();else{status.textContent='All tiles visited, but finish on gold.';sig('wrong_finish')}}}function win(){sig('level_clear');const s=load(),best=Math.max(s.bestLevel||0,level);save({bestLevel:best,unlocked:Math.max(s.unlocked||1,Math.min(TOTAL,level+1))});document.getElementById('detail').textContent=`Level ${level} cleared in ${path.length-1} moves.`;ov.classList.remove('hidden');render()}function reset(){path=[];status.textContent='Tap the blue start tile.';sig('restart');render()}document.getElementById('undo').onclick=()=>{if(path.length){path.pop();sig('undo');render()}};document.getElementById('restart').onclick=reset;document.getElementById('replay').onclick=()=>{ov.classList.add('hidden');sig('replay_click');reset()};document.getElementById('next').onclick=()=>{ov.classList.add('hidden');level=level<TOTAL?level+1:1;sig('next_level');reset()};document.getElementById('share').onclick=async()=>{const text=`I cleared Route Once level ${level} in ${path.length-1} moves.`;sig('result_share_click');try{if(navigator.share)await navigator.share({title:'Route Once',text});else await navigator.clipboard.writeText(text);status.textContent='Result ready to share.'}catch{status.textContent='Share cancelled.'}};const s=load();level=Math.min(TOTAL,Math.max(1,s.unlocked||1));render()})();</script></body></html>
