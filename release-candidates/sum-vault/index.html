<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#111827"><title>Sum Vault</title><meta name="description" content="Select number tiles to hit the target sum before the timer expires."><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:#07101c}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#111827,#07101c);display:grid;place-items:center}.app{width:min(94vw,560px);padding:16px}.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#86efac}h1{font-size:44px;margin:4px 0}.muted{color:#94a3b8}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.stat,.card{background:#111827;border:1px solid #293447;border-radius:16px;padding:12px}.stat{text-align:center}.stat b{display:block;font-size:22px}.target{text-align:center;font-size:54px;font-weight:900;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.tile{aspect-ratio:1.45;border:0;border-radius:12px;background:#1e293b;color:white;font-size:28px;font-weight:900}.tile.sel{background:#16a34a}.controls{display:flex;gap:8px;margin-top:10px}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#16a34a;color:white;flex:1}.btn.alt{background:#1e293b}.status{text-align:center;min-height:26px;font-weight:700;margin-top:8px}.overlay{position:fixed;inset:0;background:#020617e8;display:grid;place-items:center;padding:20px}.panel{width:min(92vw,440px);background:#0f172a;border:1px solid #334155;border-radius:20px;padding:20px}.hidden{display:none}.panel .btn{width:100%;margin-top:9px}.small{font-size:12px}@media(max-width:500px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><div class="brand">GameFactoryLab • release candidate</div><h1>Sum Vault</h1><p class="muted">Pick tiles that total the vault target. Chain correct rounds before time runs out.</p><div class="stats"><div class="stat"><span>Score</span><b id="score">0</b></div><div class="stat"><span>Streak</span><b id="streak">0</b></div><div class="stat"><span>Time</span><b id="time">45</b></div><div class="stat"><span>Best</span><b id="best">0</b></div></div><section class="card"><div class="brand" style="text-align:center">Target sum</div><div id="target" class="target">12</div><div id="grid" class="grid"></div><div class="controls"><button id="submit" class="btn">Unlock</button><button id="clear" class="btn alt">Clear</button></div><div id="status" class="status muted">Find the exact sum.</div></section><p class="muted small">No paid assets • no external services • test signals save locally</p></main><section id="overlay" class="overlay hidden"><div class="panel"><div class="brand">Run complete</div><h2 id="result">Vault closed.</h2><p id="detail"></p><button id="replay" class="btn">Play again</button><button id="share" class="btn alt">Share result</button></div></section><script>(()=>{'use strict';const KEY='gf_candidate_sum_vault_v1',grid=document.getElementById('grid'),targetEl=document.getElementById('target'),scoreEl=document.getElementById('score'),streakEl=document.getElementById('streak'),timeEl=document.getElementById('time'),bestEl=document.getElementById('best'),status=document.getElementById('status'),ov=document.getElementById('overlay');let nums=[],picked=new Set(),target=0,score=0,streak=0,time=45,timer=null,round=0,running=false;function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}function save(x){localStorage.setItem(KEY,JSON.stringify({...load(),...x}))}function sig(k){const s=load(),m={...(s.metrics||{})};m[k]=(m[k]||0)+1;save({metrics:m})}function rand(n){return Math.floor(Math.random()*n)}function newRound(){round++;picked.clear();nums=Array.from({length:9},()=>1+rand(9));let ids=[];while(ids.length<3){const i=rand(9);if(!ids.includes(i))ids.push(i)}target=ids.reduce((a,i)=>a+nums[i],0);render()}function selectedSum(){return [...picked].reduce((a,i)=>a+nums[i],0)}function render(){grid.innerHTML='';nums.forEach((n,i)=>{const b=document.createElement('button');b.className='tile'+(picked.has(i)?' sel':'');b.textContent=n;b.onclick=()=>{if(!running)return;picked.has(i)?picked.delete(i):picked.add(i);sig('tile_toggle');render()};grid.appendChild(b)});targetEl.textContent=target;scoreEl.textContent=score;streakEl.textContent=streak;timeEl.textContent=time;bestEl.textContent=load().bestScore||0}function start(){clearInterval(timer);score=0;streak=0;time=45;round=0;running=true;ov.classList.add('hidden');sig('run_start');newRound();timer=setInterval(()=>{time--;render();if(time<=0)finish()},1000)}function finish(){if(!running)return;running=false;clearInterval(timer);sig('run_finish');const s=load(),best=Math.max(s.bestScore||0,score);save({bestScore:best});document.getElementById('detail').textContent=`Score ${score} • best streak ${streak} • ${round} rounds seen.`;ov.classList.remove('hidden');render()}document.getElementById('submit').onclick=()=>{if(!running)return;sig('submit');if(picked.size&&selectedSum()===target){streak++;score+=100+streak*20;time=Math.min(60,time+2);status.textContent='Unlocked! +2 seconds.';sig('correct_sum');newRound()}else{streak=0;time=Math.max(0,time-3);status.textContent='Wrong sum. −3 seconds.';sig('wrong_sum');picked.clear();render();if(time===0)finish()}};document.getElementById('clear').onclick=()=>{picked.clear();sig('clear_selection');render()};document.getElementById('replay').onclick=()=>{sig('replay_click');start()};document.getElementById('share').onclick=async()=>{const text=`I scored ${score} in Sum Vault.`;sig('result_share_click');try{if(navigator.share)await navigator.share({title:'Sum Vault',text});else await navigator.clipboard.writeText(text);status.textContent='Result ready to share.'}catch{status.textContent='Share cancelled.'}};start()})();</script></body></html>
