<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#0f172a"><title>Pixel Logic</title><meta name="description" content="Solve compact 5 by 5 picture logic grids from row and column clues."><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;background:#07111f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(#111827,#06101d);display:grid;place-items:center}.app{width:min(94vw,560px);padding:16px}.brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#c4b5fd}h1{font-size:44px;margin:4px 0}.muted{color:#94a3b8}.card,.stat{background:#111827;border:1px solid #2a3548;border-radius:16px;padding:12px}.stats{display:flex;gap:8px}.stat{flex:1;text-align:center}.stat b{display:block;font-size:22px}.clues{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.clues pre{white-space:pre-wrap;margin:0;font:700 13px/1.45 ui-monospace,monospace}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}.cell{aspect-ratio:1;border:0;border-radius:8px;background:#1e293b;color:#64748b;font-size:18px;font-weight:900}.cell.fill{background:#8b5cf6;color:white}.cell.x{background:#0b1220;color:#64748b}.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:800;background:#7c3aed;color:white}.btn.alt{background:#1e293b}.controls{display:flex;gap:8px;margin-top:10px}.controls .btn{flex:1}.status{text-align:center;min-height:26px;font-weight:700;margin-top:8px}.overlay{position:fixed;inset:0;background:#020617e8;display:grid;place-items:center;padding:20px}.panel{width:min(92vw,440px);background:#0f172a;border:1px solid #334155;border-radius:20px;padding:20px}.hidden{display:none}.panel .btn{width:100%;margin-top:9px}.small{font-size:12px}</style></head><body><main class="app"><div class="brand">GameFactoryLab • release candidate</div><h1>Pixel Logic</h1><p class="muted">Fill the 5×5 grid from the row and column clues. Tap a cell to cycle blank → filled → X.</p><div class="stats"><div class="stat"><span>Level</span><b id="level">1/12</b></div><div class="stat"><span>Checks</span><b id="checks">0</b></div><div class="stat"><span>Best</span><b id="best">0</b></div></div><section class="card"><div class="clues"><div><div class="brand">Rows</div><pre id="rows"></pre></div><div><div class="brand">Columns</div><pre id="cols"></pre></div></div><div id="grid" class="grid"></div><div class="controls"><button id="check" class="btn">Check</button><button id="clear" class="btn alt">Clear</button></div><div id="status" class="status muted">Solve the pattern.</div></section><p class="muted small">No paid assets • no external services • test signals save locally</p></main><section id="overlay" class="overlay hidden"><div class="panel"><div class="brand">Puzzle solved</div><h2>Pixel perfect.</h2><p id="detail"></p><button id="next" class="btn">Next puzzle</button><button id="replay" class="btn alt">Replay</button><button id="share" class="btn alt">Share result</button></div></section><script>(()=>{'use strict';const KEY='gf_candidate_pixel_logic_v1',P=['0111010001101011000101110','1000111011101011111110101','0010001110111110111000100','1000110001101011000101110','0101011111101010111000100','1111110001101011000111111','0010011111011101111100100','1010101110001000111010101','0111010101111111010101110','1101110010111110100111011','0010010101111110010010101','1010110101111110010011111'];const TOTAL=P.length,g=document.getElementById('grid'),rowEl=document.getElementById('rows'),colEl=document.getElementById('cols'),lev=document.getElementById('level'),checksEl=document.getElementById('checks'),bestEl=document.getElementById('best'),status=document.getElementById('status'),ov=document.getElementById('overlay');let level=1,state=Array(25).fill(0),checks=0;function load(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return{}}}function save(x){localStorage.setItem(KEY,JSON.stringify({...load(),...x}))}function sig(k){const s=load(),m={...(s.metrics||{})};m[k]=(m[k]||0)+1;save({metrics:m})}function clues(line){const out=[];let run=0;for(const v of line){if(v==='1')run++;else if(run){out.push(run);run=0}}if(run)out.push(run);return out.length?out.join(' '):'0'}function renderClues(){const p=P[level-1],rows=[],cols=[];for(let r=0;r<5;r++)rows.push(`${r+1}: ${clues(p.slice(r*5,r*5+5))}`);for(let c=0;c<5;c++){let s='';for(let r=0;r<5;r++)s+=p[r*5+c];cols.push(`${c+1}: ${clues(s)}`)}rowEl.textContent=rows.join('\n');colEl.textContent=cols.join('\n')}function render(){g.innerHTML='';state.forEach((v,i)=>{const b=document.createElement('button');b.className='cell'+(v===1?' fill':v===2?' x':'');b.textContent=v===2?'×':'';b.onclick=()=>{state[i]=(state[i]+1)%3;sig('cell_cycle');render()};g.appendChild(b)});lev.textContent=`${level}/${TOTAL}`;checksEl.textContent=checks;bestEl.textContent=load().bestLevel||0;renderClues()}function solved(){const p=P[level-1];return state.every((v,i)=>(v===1)===(p[i]==='1'))}function reset(){state=Array(25).fill(0);checks=0;status.textContent='Solve the pattern.';render()}document.getElementById('check').onclick=()=>{checks++;sig('check');render();if(solved()){sig('level_clear');const s=load(),best=Math.max(s.bestLevel||0,level);save({bestLevel:best,unlocked:Math.max(s.unlocked||1,Math.min(TOTAL,level+1))});document.getElementById('detail').textContent=`Level ${level} solved after ${checks} check${checks===1?'':'s'}.`;ov.classList.remove('hidden')}else{status.textContent='Not yet. Re-read the clue runs.';sig('wrong_check')}};document.getElementById('clear').onclick=()=>{sig('clear_grid');reset()};document.getElementById('replay').onclick=()=>{ov.classList.add('hidden');sig('replay_click');reset()};document.getElementById('next').onclick=()=>{ov.classList.add('hidden');level=level<TOTAL?level+1:1;sig('next_level');reset()};document.getElementById('share').onclick=async()=>{const text=`I solved Pixel Logic level ${level} in ${checks} checks.`;sig('result_share_click');try{if(navigator.share)await navigator.share({title:'Pixel Logic',text});else await navigator.clipboard.writeText(text);status.textContent='Result ready to share.'}catch{status.textContent='Share cancelled.'}};const s=load();level=Math.min(TOTAL,Math.max(1,s.unlocked||1));render()})();</script></body></html>
